# Refreshes data/cards.json from TCGdex every Monday, and whenever you click
# "Run workflow" on the Actions tab (for example, the day a new set comes out).
name: Update card data

on:
  schedule:
    - cron: '17 9 * * 1'   # Mondays at 9:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download cards from TCGdex
        run: node scripts/build-cards.mjs
        # To also include older Expanded sets (a bigger file), uncomment:
        # env:
        #   INCLUDE_EXPANDED: 'true'
      - name: Save the new card data (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json
          if git diff --cached --quiet; then
            echo "Card data is already up to date."
          else
            git commit -m "Update card data"
            git push
          fi
