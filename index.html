<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deck Brews</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>" />
<meta name="color-scheme" content="light dark" />
<script>
  // Apply the saved theme before the page draws, so dark mode doesn't flash white.
  try { var t = JSON.parse(localStorage.getItem('db.theme') || '"system"'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --page: #E9EEF5;      /* cool desk surface */
  --paper: #FFFFFF;
  --ink: #1A2340;
  --muted: #5E6886;
  --binder: #24315C;    /* binder sheet */
  --pocket: #2F3E70;
  --line: #CDD5E3;
  --pokemon: #8B5CD6;   /* section colors */
  --trainer: #2F74C9;
  --energy: #D99A12;
  --have: #23905A;
  --short: #D9771E;
  --need: #C23B33;
  --focus: #F2C230;
  color-scheme: light;
  --btn: #24315C;
  --btn-hover: #1A2548;
  --field: #F7F9FC;
  --soft: #F4F6FA;
  --soft-hover: #E5EBF4;
  --tile-bg: #D9E0EC;
  --warn-bg: #FFF3E6;
  --warn-ink: #7A3E06;
  --note-bg: #FFF6DB;
  --scrim: rgba(16, 22, 44, .6);
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Lexend', 'Segoe UI', system-ui, sans-serif;
}
/* Dark mode: follows the device unless a theme is chosen in Settings */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  color-scheme: dark;
  --page: #0E1322;
  --paper: #172036;
  --ink: #E6EBF5;
  --muted: #9AA6C2;
  --binder: #22305A;
  --pocket: #2C3B6B;
  --line: #2C3954;
  --pokemon: #A98BEA;
  --trainer: #6EA6F2;
  --energy: #E8B33A;
  --have: #3DBE7A;
  --short: #F0A04B;
  --need: #F07068;
  --btn: #3F5BB8;
  --btn-hover: #4D6AC9;
  --field: #10182B;
  --soft: #1E2942;
  --soft-hover: #26334F;
  --tile-bg: #26334F;
  --warn-bg: #3A2A14;
  --warn-ink: #F5C58A;
  --note-bg: #3A3216;
  --scrim: rgba(3, 6, 14, .72);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0E1322;
  --paper: #172036;
  --ink: #E6EBF5;
  --muted: #9AA6C2;
  --binder: #22305A;
  --pocket: #2C3B6B;
  --line: #2C3954;
  --pokemon: #A98BEA;
  --trainer: #6EA6F2;
  --energy: #E8B33A;
  --have: #3DBE7A;
  --short: #F0A04B;
  --need: #F07068;
  --btn: #3F5BB8;
  --btn-hover: #4D6AC9;
  --field: #10182B;
  --soft: #1E2942;
  --soft-hover: #26334F;
  --tile-bg: #26334F;
  --warn-bg: #3A2A14;
  --warn-ink: #F5C58A;
  --note-bg: #3A3216;
  --scrim: rgba(3, 6, 14, .72);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
.theme-toggle { font-size: 16px; line-height: 1; padding: 6px 10px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; letter-spacing: -0.01em; }
.muted { color: var(--muted); } .small { font-size: 13px; } .warn { color: var(--need); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .row.end { margin-left: auto; }
.loading { display: grid; place-items: center; min-height: 100vh; color: var(--muted); }

/* Buttons */
.btn { background: var(--btn); color: #fff; border: 0; border-radius: var(--r-sm); padding: 8px 14px; font-weight: 600; cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--btn-hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.ghost:hover:not(:disabled) { background: var(--paper); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.danger { color: var(--need); }
.mini { border: 0; background: var(--btn); color: #fff; border-radius: var(--r-sm); padding: 4px 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
.mini.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.mini:disabled { background: var(--have); opacity: 1; cursor: default; }

/* Header */
.app { max-width: 1440px; margin: 0 auto; padding: 16px 20px 40px; }
.top { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; font-size: 24px; }
.deckpick { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex: 1; }
.deckpick select, .deckpick input, .format, .searchbar input, .searchbar select {
  background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 7px 10px;
}
.deckpick input { font-weight: 600; min-width: 180px; }
.tabs { display: flex; gap: 4px; margin: 18px 0 14px; border-bottom: 2px solid var(--line); }
.tabs button { background: none; border: 0; padding: 10px 16px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs button.on { color: var(--ink); border-color: var(--binder); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

/* Stat bar */
.statbar { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; background: var(--paper); border-radius: var(--r-md); padding: 12px 16px; margin-bottom: 12px; }
.count60 { display: flex; align-items: baseline; gap: 4px; }
.count60 b { font-family: var(--display); font-size: 32px; line-height: 1; }
.count60 span { color: var(--muted); }
.count60.done b { color: var(--have); }
.split { display: flex; gap: 14px; font-weight: 600; font-size: 14px; }
.split span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: currentColor; }
.sec-pokemon.split, .split .sec-pokemon { color: var(--pokemon); }
.split .sec-trainer { color: var(--trainer); }
.split .sec-energy { color: var(--energy); }
.missing { font-weight: 600; color: var(--short); }
.missing.none { color: var(--have); }
.issues { margin: 0 0 12px; padding: 10px 14px 10px 30px; background: var(--warn-bg); border-radius: var(--r-md); color: var(--warn-ink); font-size: 14px; }

/* Binder sheets: the deck's signature look */
.binder { background: var(--binder); border-radius: var(--r-lg); padding: 14px 16px 18px; margin-bottom: 16px; border-left: 8px solid var(--accent); }
.binder.sec-pokemon { --accent: var(--pokemon); }
.binder.sec-trainer { --accent: var(--trainer); }
.binder.sec-energy { --accent: var(--energy); }
.binder h3 { color: #fff; font-size: 18px; margin-bottom: 12px; display: flex; gap: 10px; align-items: baseline; }
.binder h3 span { font-family: var(--body); font-size: 14px; font-weight: 600; color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

.tile { display: flex; flex-direction: column; gap: 6px; }
.pocket { position: relative; display: block; padding: 4px; border: 0; border-radius: var(--r-md); background: var(--pocket); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); cursor: pointer; aspect-ratio: 63 / 88; }
.search .pocket, .collection .pocket, .assistant .pocket { background: var(--tile-bg); }
.pocket img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 7px; }
.pocket:hover img { transform: translateY(-2px); transition: transform .15s; }
@media (prefers-reduced-motion: reduce) { .pocket:hover img { transform: none; } }
.noimg { display: grid; place-items: center; height: 100%; color: #fff; font-size: 12px; padding: 6px; }
.qty { position: absolute; top: -6px; left: -6px; min-width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: #fff; color: #1A2340; font-family: var(--display); font-weight: 800; font-size: 16px; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.own { position: absolute; left: 6px; right: 6px; bottom: 6px; text-align: center; font-size: 11px; font-weight: 600; color: #fff; border-radius: 4px; padding: 1px 4px; }
.own-have { background: var(--have); } .own-short { background: var(--short); } .own-need { background: var(--need); }
.tile-actions { display: flex; gap: 6px; justify-content: center; }
.empty { background: var(--paper); border-radius: var(--r-md); padding: 28px; text-align: center; color: var(--muted); }

/* Import, search */
.import { background: var(--paper); border-radius: var(--r-md); padding: 14px 16px; margin-bottom: 14px; }
.import h3 { font-size: 17px; }
.import p { margin: 4px 0 10px; }
textarea { width: 100%; border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 10px; resize: vertical; background: var(--field); font-size: 14px; }
.import textarea { margin-bottom: 10px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.searchbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.searchbar input { flex: 1; min-width: 200px; }
.check { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.more { display: block; margin: 16px auto 0; }

/* Assistant */
.assistant { position: sticky; top: 16px; background: var(--paper); border-radius: var(--r-lg); display: flex; flex-direction: column; max-height: calc(100vh - 32px); border-top: 6px solid var(--binder); }
@media (max-width: 980px) { .assistant { position: static; max-height: none; } }
.assistant header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 8px; }
.assistant h2 { font-size: 20px; }
.thread { flex: 1; overflow-y: auto; padding: 4px 16px 12px; min-height: 240px; }
.starters { display: flex; flex-direction: column; gap: 8px; }
.starter { text-align: left; background: var(--soft); border: 0; border-radius: var(--r-md); padding: 10px 12px; cursor: pointer; font-size: 14px; }
.starter:hover { background: var(--soft-hover); }
.msg { margin: 12px 0; }
.msg p { margin: 0 0 8px; white-space: pre-wrap; }
.msg p:last-child { margin-bottom: 0; }
.msg-user p { background: var(--btn); color: #fff; padding: 9px 12px; border-radius: var(--r-md) var(--r-md) 2px var(--r-md); margin-left: 28px; }
.msg-coach { font-size: 14.5px; }
.msg-coach ul { margin: 0 0 8px; padding-left: 20px; }
.msg-coach li { margin: 2px 0; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--trainer); font-weight: 600; cursor: pointer; text-decoration: underline; }
.noimg small { opacity: .8; }
.noimg.big { display: grid; place-items: center; aspect-ratio: 63 / 88; background: var(--pocket); color: #fff; border-radius: 12px; padding: 12px; text-align: center; font-weight: 600; }
.sugg.show { border-left-color: var(--trainer); }
.sugg-status { font-size: 12px; font-weight: 600; color: var(--muted); }
.sugg-status.ok { color: var(--have); }
.remember { margin-top: 10px; padding: 10px 12px; border-radius: var(--r-md); background: var(--note-bg); display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 18px 0 8px; }
.settings textarea { font-size: 14px; }
.sugg-group { margin: 6px 0 -2px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.sources { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-top: 8px; font-size: 13px; }
.sources a { color: var(--trainer); }
.search-chips { margin-top: 6px; max-width: 100%; overflow-x: auto; }
.composer { flex-wrap: wrap; }
.webtoggle { order: 3; width: 100%; font-size: 13px; color: var(--muted); }
.filters { margin-bottom: 14px; }
.filters .searchbar { margin-bottom: 8px; }
.filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 12px; background: var(--paper); border-radius: var(--r-md); padding: 12px 14px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld.end { justify-content: flex-end; }
.fld label { font-size: 12px; font-weight: 600; color: var(--muted); }
.fld input, .fld select { background: var(--field); border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 7px 9px; width: 100%; }
.range { display: flex; align-items: center; gap: 6px; } .range span { font-size: 12px; color: var(--muted); }
.btn.has-filters { box-shadow: inset 0 0 0 2px var(--trainer); color: var(--trainer); }
.result-count { margin: 6px 2px 0; }
.prices { margin: 14px 0 4px; padding: 10px 12px; background: var(--soft); border-radius: var(--r-md); }
.prices-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.tcgp { color: var(--trainer); font-weight: 600; font-size: 14px; }
.price-table { overflow-x: auto; }
.prices table { border-collapse: collapse; width: 100%; font-size: 13px; }
.prices th, .prices td { padding: 4px 6px; text-align: right; white-space: nowrap; }
.prices thead th { color: var(--muted); font-weight: 600; }
.prices tbody th { text-align: left; font-weight: 600; }
.prices tbody tr + tr { border-top: 1px solid var(--line); }
.chat-note { text-align: center; font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
.thinking { color: var(--muted); font-style: italic; }
.suggest { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.sugg { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: start; padding: 8px; border-radius: var(--r-md); background: var(--soft); border-left: 4px solid var(--have); }
.sugg.remove { border-left-color: var(--need); }
.sugg-body { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.ghosted { aspect-ratio: 63/88; background: var(--tile-bg); border-radius: var(--r-sm); display: grid; place-items: center; font-size: 11px; text-align: center; padding: 4px; }
.composer { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line); align-items: flex-end; }
.composer textarea { flex: 1; }
.composer-actions { display: flex; flex-direction: column; gap: 6px; }
.claude-hint { margin: 0; padding: 0 16px 14px; }
.claude-hint a { color: var(--trainer); font-weight: 600; }

/* Modal */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 10; }
.modal { background: var(--paper); border-radius: var(--r-lg); display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 20px; padding: 20px; max-width: 760px; width: 100%; max-height: 92vh; overflow: auto; }
@media (max-width: 640px) { .modal { grid-template-columns: 1fr; } .modal-img { max-width: 260px; margin: 0 auto; } }
.modal-img { width: 100%; border-radius: 12px; }
.modal-body h2 { font-size: 24px; }
.modal-body p { margin: 4px 0; }
.legal { font-weight: 600; font-size: 14px; } .legal.ok { color: var(--have); } .legal.no { color: var(--need); }
.cardtext { margin: 10px 0; font-size: 14px; }
.cardtext p { margin: 2px 0 0; color: var(--muted); }
.modal-controls { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper-label { flex: 1; font-weight: 600; font-size: 14px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--btn); color: #fff; font-size: 18px; cursor: pointer; }
.stepper-val { min-width: 28px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 20px; }

/* Added for the GitHub Pages version */
.top .gear { margin-left: auto; }
.sync { font-size: 13px; color: var(--muted); }
.sync b { color: var(--have); }
.connect { max-width: 440px; margin: 12vh auto; background: var(--paper); border-radius: var(--r-lg); padding: 28px; border-top: 6px solid var(--binder); }
.connect h1 { font-size: 30px; margin-bottom: 6px; }
.connect label, .settings label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 4px; }
.connect input, .settings input, .settings select { width: 100%; background: var(--field); border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 9px 10px; }
.pw { display: flex; gap: 6px; } .pw input { flex: 1; }
.settings { max-width: 520px; display: block; }
.settings p { margin: 4px 0; }
.foot { margin-top: 28px; text-align: center; color: var(--muted); font-size: 12px; }
.btn, .mini, .stepper button, .tabs button { min-height: 36px; }
.search .noimg, .collection .noimg, .assistant .noimg { color: var(--muted); }
</style>

<div id="app"><div class="loading">Opening your decks…</div></div>
<script type="module">
import { html, render, useState, useEffect, useMemo, useRef } from 'https://unpkg.com/htm@3.1.1/preact/standalone.module.js';
import * as cfg from './firebase-config.js';

const VERSION = '1.8.1';
const firebaseConfig = cfg.firebaseConfig;
const filled = (v) => typeof v === 'string' && v.trim() !== '' && !v.startsWith('PASTE');
const FIREBASE_READY = !!(firebaseConfig && filled(firebaseConfig.apiKey));
const COACH_READY = FIREBASE_READY && filled(cfg.recaptchaSiteKey);
const GEMINI_MODEL = filled(cfg.geminiModel) ? cfg.geminiModel.trim() : 'gemini-3.5-flash-lite';
// If a model is out of free requests (or retired), the coach moves down this list.
// Flash-Lite models have a much bigger free allowance (about 500 a day) than standard Flash (about 20).
const COACH_MODELS = [...new Set([GEMINI_MODEL, 'gemini-3.5-flash-lite', 'gemini-3.1-flash-lite'])];

/* ---------- Per-device settings ---------- */
const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
function usePref(key, init) {
  const [v, setV] = useState(() => load(key, init));
  useEffect(() => save(key, v), [key, v]);
  return [v, setV];
}
// Theme: 'system' follows the device; 'light' or 'dark' overrides it.
function applyTheme(theme) {
  const el = document.documentElement;
  if (theme === 'light' || theme === 'dark') el.dataset.theme = theme; else delete el.dataset.theme;
}
applyTheme(load('db.theme', 'system'));
const systemDark = () => window.matchMedia?.('(prefers-color-scheme: dark)').matches;
const makeId = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

/* ---------- Card database (TCGdex: free, open source, no key) ---------- */
const TCGDEX_GQL = 'https://api.tcgdex.net/v2/graphql';
// Pokémon TCG Live / Limitless set codes → TCGdex set ids (built from TCGdex's open data).

const CODE_FOR_SET = {};
function rebuildCodeForSet() {
  for (const k of Object.keys(CODE_FOR_SET)) delete CODE_FOR_SET[k];
  for (const [code, ids] of Object.entries(SET_CODES)) for (const id of ids) {
    if (!CODE_FOR_SET[id] || (CODE_FOR_SET[id].includes(':') && !code.includes(':'))) CODE_FOR_SET[id] = code.split(':')[0];
  }
}
rebuildCodeForSet();
// Newer set codes arrive with the weekly card data, so new sets work without an app update.
function mergeSetCodes(extra) {
  for (const [code, ids] of Object.entries(extra || {})) SET_CODES[code.toUpperCase()] = [...new Set([...(SET_CODES[code.toUpperCase()] || []), ...ids])];
  rebuildCodeForSet();
}
const CARD_FIELDS = `id localId name image category hp types evolveFrom stage suffix trainerType energyType effect regulationMark rarity illustrator retreat
  legal { standard expanded } abilities { name effect } attacks { name cost damage effect } set { id name releaseDate tcgOnline }`;

async function gql(query, variables = {}) {
  let res;
  try { res = await fetch(TCGDEX_GQL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query, variables }) }); }
  catch { throw new Error('Couldn’t reach the card database. Check your internet connection and try again.'); }
  if (res.status === 429) throw new Error('The card database is busy. Wait a minute and try again.');
  const d = await res.json().catch(() => ({}));
  if (!res.ok || d.errors?.length) throw new Error('The card database had a problem. Try again in a minute.');
  return d.data || {};
}
const fetchCards = async (filters, perPage = 250) =>
  ((await gql(`query($f: CardsFilters, $p: Pagination) { cards(filters: $f, pagination: $p) { ${CARD_FIELDS} } }`, { f: filters, p: { page: 1, itemsPerPage: perPage } })).cards || []).filter(Boolean);

// Fetch several pages for broad searches (up to `max` cards).
async function fetchCardsPaged(filters, max = 1000) {
  const out = [];
  for (let page = 1; out.length < max; page++) {
    const batch = ((await gql(`query($f: CardsFilters, $p: Pagination) { cards(filters: $f, pagination: $p) { ${CARD_FIELDS} } }`, { f: filters, p: { page, itemsPerPage: 250 } })).cards || []).filter(Boolean);
    out.push(...batch);
    if (batch.length < 250) break;
  }
  return out;
}
const stripZeros = (n) => (/^\d+$/.test(n) ? String(parseInt(n, 10)) : n);
const TRAINER_SUBTYPE = { Tool: 'Pokémon Tool', 'Pokémon Tool': 'Pokémon Tool', Supporter: 'Supporter', Item: 'Item', Stadium: 'Stadium' };

function slimCard(c) {
  const cat = c.category === 'Pokemon' ? 'Pokémon' : c.category;
  const subtypes = [];
  if (cat === 'Pokémon') {
    if (c.stage) subtypes.push(c.stage.replace(/^Stage(\d)/, 'Stage $1'));
    if (c.suffix) subtypes.push(c.suffix);
    if (/^Radiant /.test(c.name)) subtypes.push('Radiant');
  }
  if (cat === 'Trainer' && c.trainerType) subtypes.push(TRAINER_SUBTYPE[c.trainerType] || c.trainerType);
  if (cat === 'Energy') subtypes.push(/^(normal|basic)$/i.test(c.energyType || '') ? 'Basic' : 'Special');
  if (/ace spec/i.test(c.rarity || '')) subtypes.push('ACE SPEC');
  const setId = c.set?.id || '';
  return {
    id: c.id, name: c.name, supertype: cat || '', subtypes, types: c.types || [],
    hp: c.hp ?? null, evolvesFrom: c.evolveFrom || null,
    setCode: CODE_FOR_SET[setId] || c.set?.tcgOnline || setId.toUpperCase(), setName: c.set?.name || '',
    number: stripZeros(String(c.localId ?? '')), releaseDate: c.set?.releaseDate || '',
    regulationMark: c.regulationMark || null, rarity: c.rarity || '', illustrator: c.illustrator || '', retreat: c.retreat ?? null,
    standard: !!c.legal?.standard, expanded: !!c.legal?.expanded,
    image: c.image ? `${c.image}/low.webp` : null, imageLarge: c.image ? `${c.image}/high.webp` : null,
    rules: cat !== 'Pokémon' && c.effect ? [c.effect] : [],
    abilities: (c.abilities || []).map((a) => ({ name: a.name || '', text: a.effect || '' })),
    attacks: (c.attacks || []).map((a) => ({ name: a.name || '', cost: a.cost || [], damage: a.damage != null ? String(a.damage) : '', text: a.effect || '' })),
  };
}
const newestFirst = (a, b) => (b.releaseDate || '').localeCompare(a.releaseDate || '');

// TCGdex ids look like "sv06-128" or "sv01-001": try the number as given and zero-padded.
function candidateIds(code, number) {
  if (!code || !number) return [];
  const up = code.toUpperCase();
  const prefix = (number.match(/^[A-Z]+/) || [''])[0];
  const sets = (prefix && SET_CODES[`${up}:${prefix}`]) || SET_CODES[up] || [];
  const nums = new Set([number]);
  if (/^\d+$/.test(number)) { const n = String(parseInt(number, 10)); nums.add(n); nums.add(n.padStart(3, '0')); }
  const out = [];
  for (const sid of sets) for (const n of nums) out.push(`${sid}-${n}`);
  return out;
}

const ENERGY = { G: 'Grass', R: 'Fire', W: 'Water', L: 'Lightning', P: 'Psychic', F: 'Fighting', D: 'Darkness', M: 'Metal' };
const normName = (n) => n.replace(/\{([GRWLPFDM])\}/g, (_, x) => ENERGY[x]).replace(/\s+/g, ' ').trim();
const cleanFilter = (s) => String(s).replace(/[|,:]/g, ' ').trim();

/* ---------- Saved card data (data/cards.json, refreshed weekly by a GitHub Action) ---------- */
// The app searches this copy first and only asks TCGdex live for cards it doesn't include.
let LOCAL = null; // { cards, byId, byName, updated, series, setIds }
const localReady = (async () => {
  try {
    const res = await fetch('data/cards.json', { cache: 'no-cache' });
    if (!res.ok) return null;
    const d = await res.json();
    mergeSetCodes(d.setCodes);
    const cards = (d.cards || []).map((c) => slimCard({ ...c, set: { id: c.set, ...(d.sets?.[c.set] || {}) } }));
    const byId = {}, byName = {};
    for (const c of cards) { byId[c.id] = c; (byName[c.name.toLowerCase()] ||= []).push(c); }
    LOCAL = { cards, byId, byName, updated: d.updated || '', series: d.series || [], setIds: new Set(Object.keys(d.sets || {})) };
    return LOCAL;
  } catch (e) { console.warn('No saved card data; using TCGdex live', e); return null; }
})();
const pickBest = (list) => { const sorted = [...list].sort(newestFirst); return sorted.find((c) => c.standard) || sorted[0]; };

async function findByName(raw) {
  const name = normName(raw);
  const tries = [name];
  if (/^Basic /i.test(name)) tries.push(name.replace(/^Basic /i, ''));
  else if (/ Energy$/i.test(name)) tries.push('Basic ' + name);
  await localReady;
  if (LOCAL) for (const n of tries) { const list = LOCAL.byName[n.toLowerCase()]; if (list?.length) return pickBest(list); }
  for (const n of tries) {
    const list = (await fetchCards({ name: `eq:${cleanFilter(n)}` }, 100)).map(slimCard);
    if (list.length) return pickBest(list);
  }
  return null;
}

/* ---------- Extra cards TCGdex doesn't have ---------- */
const extraCard = (c) => ({ supertype: 'Trainer', subtypes: [], types: [], hp: null, evolvesFrom: null, setName: '', regulationMark: null,
  standard: false, expanded: false, image: null, imageLarge: null, rules: [], abilities: [], attacks: [], releaseDate: '', ...c });
const BUILT_IN_EXTRAS = [
  extraCard({
    id: 'clc-026', name: 'Scorching Charcoal', supertype: 'Trainer', subtypes: ['Pokémon Tool'],
    setCode: 'CLC', setName: 'Pokémon Trading Card Game Classic (Charizard)', number: '26', releaseDate: '2023-11-17',
    image: 'https://tcgplayer-cdn.tcgplayer.com/product/527972_in_400x400.jpg',
    imageLarge: 'https://tcgplayer-cdn.tcgplayer.com/product/527972_in_1000x1000.jpg',
    tcgplayerUrl: 'https://www.tcgplayer.com/product/527972/pokemon-trading-card-game-classic-scorching-charcoal?Language=English',
    rules: ['The attacks used by the Charizard this card is attached to do 100 more damage to your opponent’s Active Pokémon (before applying Weakness and Resistance).', '(This card cannot be used at official tournaments.)'],
    builtIn: true,
  }),
];
let EXTRA_CARDS = [...BUILT_IN_EXTRAS]; // the App adds the family's own cards to this list
const extraByCode = (code, number) => EXTRA_CARDS.find((c) => c.setCode && code && c.setCode.toUpperCase() === code.toUpperCase() && stripZeros(c.number) === stripZeros(number || ''));
const extraByName = (name) => { const n = normName(name).toLowerCase(); return EXTRA_CARDS.find((c) => c.name.toLowerCase() === n); };

async function resolveLines(lines) {
  await localReady;
  const cands = lines.map((l) => candidateIds(l.setCode, l.number));
  const found = {};
  if (LOCAL) for (const id of cands.flat()) if (LOCAL.byId[id]) found[id] = LOCAL.byId[id];
  // Only ask TCGdex for lines the saved copy couldn't match.
  const ids = [...new Set(cands.filter((c) => !c.some((id) => found[id])).flat())];
  for (let i = 0; i < ids.length; i += 60) {
    try { for (const c of await fetchCards({ id: 'eq:' + ids.slice(i, i + 60).join('|') })) found[c.id] = slimCard(c); }
    catch (e) { if (!LOCAL) throw e; console.warn('TCGdex unavailable for some lines', e); }
  }
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    let card = extraByCode(lines[i].setCode, lines[i].number) || cands[i].map((id) => found[id]).find(Boolean) || null;
    if (!card && lines[i].name) { try { card = extraByName(lines[i].name) || await findByName(lines[i].name); } catch (e) { if (!LOCAL) throw e; } }
    out.push({ ...lines[i], card });
  }
  return out;
}

const KIND = { pokemon: 'Pokemon', trainer: 'Trainer', energy: 'Energy' };
const ENERGY_TYPES = ['Grass', 'Fire', 'Water', 'Lightning', 'Psychic', 'Fighting', 'Darkness', 'Metal', 'Dragon', 'Colorless'];
const SPECIALS = { ex: 'Pokémon ex', mega: 'Mega Evolution', v: 'V, VSTAR, VMAX', radiant: 'Radiant', ace: 'ACE SPEC', none: 'No rule box' };
const TRAINER_KINDS = ['Item', 'Supporter', 'Pokémon Tool', 'Stadium'];
const SORTS = { newest: 'Newest first', oldest: 'Oldest first', name: 'Name (A–Z)', hp: 'HP (high to low)', number: 'Set and number' };
const blankFilters = (format = 'standard') => ({ q: '', text: '', kind: 'all', energy: '', stage: '', special: '', trainer: '', energyKind: '', hpMin: '', hpMax: '', set: '', mark: '', format, rarity: '', artist: '', sort: 'newest' });
const ADVANCED_KEYS = ['text', 'energy', 'stage', 'special', 'trainer', 'energyKind', 'hpMin', 'hpMax', 'set', 'mark', 'rarity', 'artist'];
const activeAdvanced = (f) => ADVANCED_KEYS.filter((k) => String(f[k] || '').trim()).length;

const lc = (v) => String(v || '').toLowerCase();
function specialOf(c) {
  const n = c.name || '';
  if (c.subtypes.includes('ACE SPEC')) return 'ace';
  if (/^Mega /.test(n)) return 'mega';
  if (/ ex$/.test(n)) return 'ex';
  if (/ (V|VSTAR|VMAX|V-UNION)$/.test(n) || c.subtypes.some((t) => /^(V|VSTAR|VMAX)$/.test(t))) return 'v';
  if (/^Radiant /.test(n) || c.subtypes.includes('Radiant')) return 'radiant';
  return 'none';
}
const cardText = (c) => [...c.attacks.map((a) => `${a.name} ${a.text}`), ...c.abilities.map((a) => `${a.name} ${a.text}`), ...c.rules].join(' ').toLowerCase();
const markList = (m) => String(m || '').toUpperCase().split(/[\s,|]+/).filter(Boolean);

// Every filter, checked on our side (used for the Card Library and to finish Find cards results).
function matchesFilters(c, f, { skipFormat = false } = {}) {
  const sec = sectionOf(c);
  if (f.q.trim() && !lc(c.name).includes(lc(f.q.trim()))) return false;
  if (f.text.trim() && !f.text.toLowerCase().split(/\s+/).filter(Boolean).every((w) => cardText(c).includes(w))) return false;
  if (f.kind !== 'all' && sec !== f.kind) return false;
  if (f.energy && !(c.types || []).includes(f.energy)) return false;
  if (f.stage && !(sec === 'pokemon' && c.subtypes.includes(f.stage))) return false;
  if (f.special && specialOf(c) !== f.special) return false;
  if (f.trainer && !(sec === 'trainer' && c.subtypes.includes(f.trainer))) return false;
  if (f.energyKind && !(sec === 'energy' && c.subtypes.includes(f.energyKind))) return false;
  if (f.hpMin && !(Number(c.hp) >= Number(f.hpMin))) return false;
  if (f.hpMax && !(Number(c.hp) > 0 && Number(c.hp) <= Number(f.hpMax))) return false;
  if (f.set.trim() && c.setCode.toUpperCase() !== f.set.trim().toUpperCase()) return false;
  if (f.mark.trim() && !markList(f.mark).includes(String(c.regulationMark || '').toUpperCase())) return false;
  if (f.rarity.trim() && !lc(c.rarity).includes(lc(f.rarity.trim()))) return false;
  if (f.artist.trim() && !lc(c.illustrator).includes(lc(f.artist.trim()))) return false;
  if (!skipFormat && f.format === 'standard' && !c.standard) return false;
  if (!skipFormat && f.format === 'expanded' && !c.expanded) return false;
  return true;
}
const numKey = (n) => String(n || '').replace(/\d+/, (d) => d.padStart(4, '0'));
function sortCards(cards, sort) {
  const by = {
    newest: (a, b) => newestFirst(a, b) || numKey(a.number).localeCompare(numKey(b.number)),
    oldest: (a, b) => -newestFirst(a, b) || numKey(a.number).localeCompare(numKey(b.number)),
    name: (a, b) => a.name.localeCompare(b.name) || newestFirst(a, b),
    hp: (a, b) => (Number(b.hp) || 0) - (Number(a.hp) || 0) || a.name.localeCompare(b.name),
    number: (a, b) => a.setCode.localeCompare(b.setCode) || numKey(a.number).localeCompare(numKey(b.number)),
  }[sort] || newestFirst;
  return [...cards].sort(by);
}

// Find cards: send what TCGdex can filter, then apply the rest here.
const STAGE_TCGDEX = { Basic: 'Basic', 'Stage 1': 'Stage1', 'Stage 2': 'Stage2' };
const TRAINER_TCGDEX = { Item: 'Item', Supporter: 'Supporter', 'Pokémon Tool': 'Tool', Stadium: 'Stadium' };
const anyFilter = (f) => !!(f.q.trim() || f.kind !== 'all' || activeAdvanced(f));
async function searchCards(f) {
  await localReady;
  const extras = EXTRA_CARDS.filter((c) => matchesFilters(c, f, { skipFormat: true }) && (f.q.trim() || f.set.trim() || f.text.trim()));
  if (!LOCAL) return searchTcgdex(f, extras);
  if (!anyFilter(f)) return { cards: extras, needMore: !extras.length };
  const local = LOCAL.cards.filter((c) => matchesFilters(c, f));
  // The saved copy has every Standard card. Other formats may need older cards from TCGdex.
  const setIds = f.set.trim() ? SET_CODES[f.set.trim().toUpperCase()] || [] : null;
  const covered = f.format === 'standard' || (f.format === 'expanded' && LOCAL.series.includes('Black & White')) || (setIds && setIds.length && setIds.every((id) => LOCAL.setIds.has(id)));
  if (covered) return { cards: [...sortCards(extras, f.sort), ...sortCards(local, f.sort)] };
  try {
    const remote = await searchTcgdex(f, []);
    const seen = new Set(local.map((c) => c.id));
    const merged = [...local, ...remote.cards.filter((c) => !seen.has(c.id))];
    return { cards: [...sortCards(extras, f.sort), ...sortCards(merged, f.sort)], capped: remote.capped };
  } catch (e) {
    return { cards: [...sortCards(extras, f.sort), ...sortCards(local, f.sort)],
      note: `Showing cards from the saved card data (${LOCAL.series.join(' and ')} eras). Older cards need the online card database, which isn’t available right now (${e.message})` };
  }
}
async function searchTcgdex(f, extras) {
  const tf = {};
  if (f.q.trim()) tf.name = cleanFilter(f.q);
  if (f.kind !== 'all') tf.category = `eq:${KIND[f.kind]}`;
  if (f.energy) tf.types = f.energy;
  if (f.stage) { tf.stage = `eq:${STAGE_TCGDEX[f.stage]}`; tf.category = 'eq:Pokemon'; }
  if (f.trainer) { tf.trainerType = `eq:${TRAINER_TCGDEX[f.trainer]}`; tf.category = 'eq:Trainer'; }
  if (f.energyKind) { tf.energyType = f.energyKind === 'Basic' ? 'eq:Normal|Basic' : 'eq:Special'; tf.category = 'eq:Energy'; }
  if (f.set.trim()) {
    const ids = SET_CODES[f.set.trim().toUpperCase()];
    if (!ids) throw new Error(`Unknown set code “${f.set.trim()}”. Try a code like TWM or MEG.`);
    tf.id = ids.map((id) => `${id}-`).join('|');
  }
  if (f.mark.trim()) tf.regulationMark = 'eq:' + markList(f.mark).join('|');
  if (f.rarity.trim()) tf.rarity = cleanFilter(f.rarity);
  if (f.artist.trim()) tf.illustrator = cleanFilter(f.artist);
  if (!Object.keys(tf).length && !f.text.trim()) return { cards: extras, needMore: !extras.length };
  if (!Object.keys(tf).length) throw new Error('Card text search needs at least one other filter, like a name, type, set or regulation mark.');
  const raw = await fetchCardsPaged(tf, 1000);
  const cards = raw.map(slimCard).filter((c) => matchesFilters(c, f));
  return { cards: [...sortCards(extras, f.sort), ...sortCards(cards, f.sort)], capped: raw.length >= 1000 };
}

// Prices from TCGplayer, via TCGdex (fetched when a card's details are opened).
const priceCache = {};
async function fetchPrices(card) {
  if (!card || card.custom || card.builtIn || !/^[a-z0-9.]+-[A-Za-z0-9]+$/.test(card.id)) return null;
  if (priceCache[card.id]) return priceCache[card.id];
  const res = await fetch(`https://api.tcgdex.net/v2/en/cards/${encodeURIComponent(card.id)}`);
  if (!res.ok) return null;
  const tp = (await res.json())?.pricing?.tcgplayer;
  if (!tp) return (priceCache[card.id] = { rows: [] });
  const LABELS = { normal: 'Normal', holofoil: 'Holofoil', 'reverse-holofoil': 'Reverse holo', reverse: 'Reverse holo', '1st-edition': '1st edition', '1st-edition-holofoil': '1st edition holo', unlimited: 'Unlimited', 'unlimited-holofoil': 'Unlimited holo' };
  const rows = Object.entries(tp).filter(([, v]) => v && typeof v === 'object').map(([k, v]) => ({ label: LABELS[k] || k, low: v.lowPrice, mid: v.midPrice, high: v.highPrice, market: v.marketPrice }));
  return (priceCache[card.id] = { rows, updated: tp.updated, unit: tp.unit || 'USD' });
}

/* ---------- Deck rules ---------- */
const sectionOf = (c) => (c.supertype?.startsWith('Pok') ? 'pokemon' : c.supertype === 'Trainer' ? 'trainer' : 'energy');
const isBasicEnergy = (c) => c.supertype === 'Energy' && c.subtypes.includes('Basic');
const TRAINER_ORDER = ['Supporter', 'Item', 'Pokémon Tool', 'Stadium'];
const tRank = (c) => { const i = TRAINER_ORDER.findIndex((t) => c.subtypes.includes(t)); return i < 0 ? 9 : i; };
function sortEntries(list) {
  return [...list].sort((a, b) => {
    const s = sectionOf(a.card);
    if (s === 'trainer') return tRank(a.card) - tRank(b.card) || b.count - a.count;
    if (s === 'energy') return isBasicEnergy(a.card) - isBasicEnergy(b.card) || b.count - a.count;
    return 0;
  });
}
const printKey = (c) => (sectionOf(c) === 'pokemon' ? `${c.name}|${c.attacks.map((a) => a.name).join(',')}` : c.name);
function ownedCount(card, coll) {
  const k = printKey(card); let n = 0;
  for (const e of Object.values(coll)) if (e.card.id === card.id || printKey(e.card) === k) n += e.count;
  return n;
}
function analyzeDeck(entries, coll, format) {
  const counts = { pokemon: 0, trainer: 0, energy: 0 }, byName = {}, illegal = [];
  let missing = 0, ace = 0, radiant = 0;
  for (const { card, count } of entries) {
    counts[sectionOf(card)] += count;
    if (!isBasicEnergy(card)) byName[card.name] = (byName[card.name] || 0) + count;
    if (card.subtypes.includes('ACE SPEC')) ace += count;
    if (card.subtypes.includes('Radiant')) radiant += count;
    if ((format === 'standard' && !card.standard) || (format === 'expanded' && !card.expanded)) illegal.push(card.name);
    missing += Math.max(0, count - ownedCount(card, coll));
  }
  const total = counts.pokemon + counts.trainer + counts.energy, issues = [];
  const s = (n) => (n === 1 ? '' : 's');
  if (total !== 60) issues.push(total < 60 ? `Add ${60 - total} more card${s(60 - total)} to reach 60.` : `Remove ${total - 60} card${s(total - 60)} to get down to 60.`);
  for (const [n, c] of Object.entries(byName)) if (c > 4) issues.push(`${n}: ${c} copies (limit is 4).`);
  if (total && !entries.some((e) => sectionOf(e.card) === 'pokemon' && e.card.subtypes.includes('Basic'))) issues.push('The deck needs at least one Basic Pokémon.');
  if (ace > 1) issues.push(`${ace} ACE SPEC cards (limit is 1).`);
  if (radiant > 1) issues.push(`${radiant} Radiant Pokémon (limit is 1).`);
  for (const n of new Set(illegal)) issues.push(`${n} isn’t legal in ${format === 'standard' ? 'Standard' : 'Expanded'}.`);
  return { total, counts, missing, issues };
}

/* ---------- Decklist text (Limitless / Pokémon TCG Live format) ---------- */
const HEADER = /^(pok[eé]mon|trainers?|energy|total cards)\s*[:\-]?\s*\d*\s*$/i;
const FULL = /^(\d+)\s+(.+?)\s+([A-Z][A-Z0-9-]{1,6})\s+([A-Z]{0,3}\d+[a-z]?)$/;
function parseDecklist(text) {
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(/^[*•\-]\s*/, '').trim();
    if (!line || HEADER.test(line)) continue;
    let m = line.match(FULL);
    if (m) { out.push({ count: +m[1], name: m[2], setCode: m[3], number: m[4], raw: line }); continue; }
    m = line.match(/^(\d+)\s+(.+)$/);
    if (m) out.push({ count: +m[1], name: m[2], setCode: '', number: '', raw: line });
  }
  return out;
}
function exportDecklist(entries) {
  const out = [];
  for (const [sec, label] of [['pokemon', 'Pokémon'], ['trainer', 'Trainer'], ['energy', 'Energy']]) {
    const list = sortEntries(entries.filter((e) => sectionOf(e.card) === sec));
    if (!list.length) continue;
    out.push(`${label}: ${list.reduce((n, e) => n + e.count, 0)}`);
    for (const e of list) out.push(`${e.count} ${e.card.name} ${e.card.setCode} ${e.card.number}`);
    out.push('');
  }
  out.push(`Total Cards: ${entries.reduce((n, e) => n + e.count, 0)}`);
  return out.join('\n');
}
const collectionText = (coll) => Object.values(coll).sort((a, b) => a.card.name.localeCompare(b.card.name))
  .map((e) => `${e.count} ${e.card.name} ${e.card.setCode} ${e.card.number}`).join('\n');

    setOwned: (card, count) => (count <= 0 ? fs.deleteDoc(fs.doc(collCol, card.id)) : fs.setDoc(fs.doc(collCol, card.id), { card, count })),

/* ---------- Deck coach (Gemini through Firebase AI Logic, free tier) ---------- */
const formatName = (f) => (f === 'standard' ? 'Standard' : f === 'expanded' ? 'Expanded' : 'Casual (home games: any cards allowed, including non-tournament cards)');
const RULES_TEXT = `Deck rules: exactly 60 cards, at most 4 copies of any card by name (basic Energy is unlimited), at least one Basic Pokémon, at most 1 ACE SPEC and 1 Radiant Pokémon.`;

const SYSTEM = `You are a friendly, expert Pokémon TCG deck-building coach helping a parent and their kid build 60-card decks.

How you help:
- Work from the current deck and the cards in their Card Library (their collection in the app; both given in each message).
- Suggest a mix: the best options from cards in their collection AND good cards they don't have in the app yet, including full evolution lines (for example 3 Charmander, 1 Charmeleon, 2 Charizard ex), so they know what to look for in their binders or pick up later. Their Card Library may be incomplete, so say "not in your Card Library" rather than "you don't own".
- Use "group" in suggestions to organize them, for example "From your collection", "Charizard ex line", or "Worth picking up".
- When they paste or mention a list from Limitless or another site, compare it with their collection, point out what's missing, and suggest realistic substitutes from what they own, explaining the trade-off.
- Respect the rules. ${RULES_TEXT} Use the format given in the message.
- Explain the "why" simply enough for a kid to follow: what the deck is trying to do, how the pieces fit together, and how a change affects consistency.
- When web search is available, look up current decklists for this deck's archetype on limitlesstcg.com (and other reliable Pokémon TCG sites) and use them to guide your suggestions; say where the idea came from, e.g. "Most Charizard ex lists on Limitless play 4 Arven." If they paste a link, read that page.
- Never invent cards. If you aren't sure a card exists or what its set code is, leave setCode and number empty and say you're unsure. Newer cards may be beyond what you know; if a card is unfamiliar, reason from its name and ask about its text rather than guessing.

Card pictures (important):

Don't repeat yourself:
- Earlier answers in the chat end with a note in square brackets listing what you suggested and what the family did: "added", "removed", "passed" (they said no thanks), or "no action yet".
- Don't suggest a card again if it was added or passed, unless they ask about it or something changed. For passed cards, offer different options instead.
- Cards already in the current deck don't need to be suggested again; suggest adding more copies only when that's the point.

Coach notes and memory:
- "Coach notes" in each message are lasting family preferences. Follow them in every answer.

- "Our other decks" lists their other decks. You can mention them when helpful (for example, a card already used in another deck).

Always answer with only a JSON object: {"reply": string, "suggestions": [{"action": "add" | "remove", "name": string, "setCode": string, "number": string, "count": number, "reason": string, "group": string}], "remember": string}. Keep "reply" conversational and short (usually under 200 words): short paragraphs, and "- " lines for lists. Use Pokémon TCG Live set codes (e.g. TWM, SFA, PAF) and collector numbers in "suggestions". Use an empty list only when you're not recommending any specific cards.`;

// Two versions of the coach model: one with light "thinking" (faster, leaves room for the answer),
// and a plain one in case the configured model doesn't accept thinking settings.
const modelPromises = {};
function getCoachModel(light = true, modelName = GEMINI_MODEL, web = false) {
  const key = `${modelName}|${light ? 'light' : 'plain'}|${web ? 'web' : 'local'}`;
  modelPromises[key] ||= (async () => {
    const app = await getFirebaseApp();
    const { getAI, getGenerativeModel, GoogleAIBackend, Schema, ThinkingLevel } = await import(FB + 'firebase-ai.js');
    const schema = Schema.object({ properties: {
      reply: Schema.string(),
      suggestions: Schema.array({ items: Schema.object({
        properties: {
          action: Schema.enumString({ enum: ['add', 'remove'] }), name: Schema.string(),
          setCode: Schema.string(), number: Schema.string(), count: Schema.integer(), reason: Schema.string(), group: Schema.string(),
        },
        optionalProperties: ['setCode', 'number', 'group'],

let useLightThinking = true;

function describeDecks(decks, currentId) {

    const total = d.entries.reduce((n, e) => n + e.count, 0);
    const mons = d.entries.filter((e) => sectionOf(e.card) === 'pokemon').sort((a, b) => b.count - a.count).slice(0, 3).map((e) => e.card.name);

// What happened to a coach answer's suggestions, so the coach doesn't repeat itself.
function suggestionOutcomes(m) {

function friendlyCoachError(e) {
  const m = `${e?.code || ''} ${e?.message || ''}`.toLowerCase();
  if (/quota|resource.?exhausted|429|rate/.test(m)) return isPerMinute(e)
    ? 'The coach is getting questions too fast for the free plan. Wait a minute, then ask again.'
    : 'The coach has used up today’s free requests. They reset overnight (Pacific time). Until then, use Copy for Claude.';
  if (/app.?check|recaptcha|attestation|403|permission/.test(m)) return 'Firebase blocked the coach. Check the App Check and reCAPTCHA steps in SETUP.md, including your site’s address in the reCAPTCHA domains.';
  if (/not.?found|404|model/.test(m)) return `None of the coach models are available right now. Update geminiModel in firebase-config.js to a current Flash-Lite model (see SETUP.md).`;
  if (/api.?not.?enabled|ai logic|firebasevertexai|generativelanguage/.test(m)) return 'AI Logic isn’t turned on for this Firebase project yet. See step 2 in SETUP.md.';
  if (/network|fetch|offline/.test(m)) return 'Couldn’t reach the coach. Check your internet connection and try again.';
  return 'The coach couldn’t answer. Try again, or use Copy for Claude.';
}

// Pull the coach's JSON answer out of the response, even if it has stray text around it.
function parseCoachJson(text) {
  let t = String(text || '').replace(/^\s*```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) t = t.slice(a, b + 1);
  const d = JSON.parse(t);
  return { reply: String(d.reply || ''), suggestions: Array.isArray(d.suggestions) ? d.suggestions.filter((x) => x && x.name) : [], remember: String(d.remember || '').trim() };

// If the answer was cut off partway, rescue the written reply so it isn't lost.
function salvageReply(text) {

  try { return JSON.parse(`"${m[1].replace(/\\$/, '')}"`); } catch { return m[1].replace(/\\n/g, '\n').replace(/\\"/g, '"'); }

const isQuotaError = (e) => /quota|resource.?exhausted|429|rate.?limit/i.test(`${e?.code || ''} ${e?.message || ''}`);
const isPerMinute = (e) => /per.?minute|perminute|rpm/i.test(`${e?.message || ''}`);
const isMissingModel = (e) => /not.?found|404|is not supported|unknown model/i.test(`${e?.code || ''} ${e?.message || ''}`);

async function callCoach(contents, web = false) {
  let lastError;
  while (modelIndex < COACH_MODELS.length) {
    const name = currentCoachModel();
    try {
      return { result: await (await getCoachModel(useLightThinking, name, web)).generateContent({ contents }), web };
    } catch (e) {
      lastError = e;
      // Some models don't accept thinking settings; use the plain version and try again.
      if (useLightThinking && /thinking/i.test(`${e?.message || ''}`)) { useLightThinking = false; continue; }
      // If web search isn't available (tool not allowed, its own quota used up), answer without it.
      if (web) { console.warn('Web search unavailable, answering without it', e); web = false; continue; }
      // Out of free daily requests, or the model was retired: move to the next model.
      if ((isQuotaError(e) && !isPerMinute(e)) || isMissingModel(e)) {
        console.warn(`Coach model ${name} unavailable, trying the next one`, e);
        if (modelIndex < COACH_MODELS.length - 1) { modelIndex++; continue; }
      }
      throw e;
    }
  }
  throw lastError;
}

// Google requires showing its search suggestions and the sources whenever an answer used Google Search.
function groundingInfo(result) {
  const g = result?.response?.candidates?.[0]?.groundingMetadata;
  if (!g) return {};
  const sources = [];
  const seen = new Set();
  for (const c of g.groundingChunks || []) {
    const uri = c.web?.uri, title = c.web?.title || c.web?.domain || 'Source';
    if (uri && !seen.has(uri)) { seen.add(uri); sources.push({ title, uri }); }
  }
  return { searchHtml: g.searchEntryPoint?.renderedContent || '', sources: sources.slice(0, 8) };
}

    { role: 'user', parts: [{ text: `${deckContext(deck, collection, format, notes, otherDecks)}\n\n${useWeb ? '(Web search is available for this question.)\n\n' : ''}${message}` }] },

    const contents = attempt === 0 ? base : [...base.slice(0, -1), { role: 'user', parts: [{ text: base[base.length - 1].parts[0].text + '\n\n(Please keep this answer short: under 150 words, and at most 6 suggestions. Answer with only the JSON object.)' }] }];
    let res;
    try { res = await callCoach(contents, useWeb); }
    catch (e) { console.error(e); throw new Error(friendlyCoachError(e)); }
    const { result } = res;
    const extra = { ...groundingInfo(result), webNote: useWeb && !res.web ? 'Web search wasn’t available for this answer, so it’s from the coach’s own knowledge.' : '' };
    try { lastText = result.response.text(); } catch (e) { console.error('Coach response had no text', e, result?.response); lastText = ''; }

      if (rescued) return { reply: rescued.trim() + '\n\n*(This answer got cut off. Ask “keep going” to hear the rest.)*', suggestions: [], ...extra };
      // A plain-text answer (common with web search) is still useful: show it as the reply.
      if (lastText.trim().length > 40 && !/^\s*[{\[]/.test(lastText)) return { reply: lastText.trim(), suggestions: [], ...extra };
    }
  }
  throw new Error('The coach’s answer came back garbled twice. Try a shorter question, or start a New chat (long chats give the coach more to read).');
}

/* ---------- Small components ---------- */
function ownState(count, owned) { return owned >= count ? 'have' : owned > 0 ? 'short' : 'need'; }

// Shows the card picture, or the card name if there's no picture or it fails to load.
function CardImage({ card, large }) {
  const [failed, setFailed] = useState(false);
  const src = large ? card.imageLarge || card.image : card.image;
  if (!src || failed) return html`<span class=${large ? 'noimg big' : 'noimg'}>${card.name}${card.setCode ? html`<br /><small>${card.setCode} ${card.number}</small>` : ''}</span>`;
  return html`<img class=${large ? 'modal-img' : ''} src=${src} alt=${large ? card.name : ''} loading="lazy" onError=${() => setFailed(true)} />`;
}

function CardTile({ card, count, owned, onOpen, children }) {
  const st = count != null && owned != null ? ownState(count, owned) : null;
  return html`<div class="tile">
    <button class="pocket" onClick=${() => onOpen?.(card)} aria-label=${`${card.name}, ${card.setCode} ${card.number}`}>
      <${CardImage} card=${card} />
      ${count != null && html`<span class="qty">${count}</span>`}
      ${st && html`<span class=${`own own-${st}`} title=${`We own ${owned} of ${count}`}>${st === 'have' ? 'Owned' : `Need ${count - owned}`}</span>`}
    </button>
    ${children && html`<div class="tile-actions">${children}</div>`}
  </div>`;
}

function Stepper({ label, value, onChange, max = 99 }) {
  return html`<div class="stepper" role="group" aria-label=${label}>
    <span class="stepper-label">${label}</span>
    <button onClick=${() => onChange(Math.max(0, value - 1))} aria-label=${`Fewer: ${label}`}>−</button>
    <span class="stepper-val">${value}</span>
    <button onClick=${() => onChange(Math.min(max, value + 1))} aria-label=${`More: ${label}`}>+</button>
  </div>`;
}

function useEscape(onClose) {
  useEffect(() => { const k = (e) => e.key === 'Escape' && onClose(); window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, [onClose]);
}

function ImportBox({ title, hint, actions, onDone }) {
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  async function run(mode) {
    const lines = parseDecklist(text);
    if (!lines.length) return setMsg({ bad: true, text: 'No card lines found. Each line should look like “4 Dreepy TWM 128”.' });
    setBusy(true); setMsg(null);
    try {
      const results = await resolveLines(lines);
      const ok = results.filter((x) => x.card), failed = results.filter((x) => !x.card).map((x) => x.raw);
      await onDone(ok.map((x) => ({ card: x.card, count: x.count })), mode);
      setMsg({ bad: failed.length > 0, text: failed.length ? `Imported ${ok.length} lines. Couldn’t find: ${failed.join('; ')}` : `Imported ${ok.length} lines.` });
      if (!failed.length) setText('');
    } catch (e) { setMsg({ bad: true, text: e.message || 'Import failed.' }); }
    finally { setBusy(false); }
  }
  return html`<div class="import">
    <h3>${title}</h3>
    <p class="muted small">${hint}</p>
    <textarea rows="7" value=${text} onInput=${(e) => setText(e.target.value)} placeholder=${'Pokémon: 12\n4 Dreepy TWM 128\n...'} aria-label=${title}></textarea>
    <div class="row">${actions.map((a) => html`<button class=${`btn ${a.primary ? '' : 'ghost'}`} disabled=${busy || !text.trim()} onClick=${() => run(a.mode)}>${busy ? 'Looking up cards…' : a.label}</button>`)}</div>
    ${msg && html`<p class=${`small ${msg.bad ? 'warn' : 'muted'}`}>${msg.text}</p>`}
  </div>`;
}

  const [st, setSt] = useState({ cards: [], shown: PAGE, busy: false, error: null, searched: false, capped: false, needMore: false });

    setSt((s) => ({ ...s, busy: true, error: null }));

      const d = await searchCards({ ...blankFilters(), ...f });
      setSt({ cards: d.cards, shown: PAGE, busy: false, error: null, searched: true, capped: !!d.capped, needMore: !!d.needMore, note: d.note || '' });

  useEffect(() => { const ff = { ...blankFilters(), ...f }; if (ff.q.trim() || ff.kind !== 'all' || activeAdvanced(ff)) search(); }, []);
  const visible = st.cards.slice(0, st.shown);
  return html`<section class="search">

/* ---------- Card Library tab ---------- */
function CollectionView({ collection, store, onOpen }) {
  const [f, setF] = usePref('db.libraryFilters', { ...blankFilters('any'), sort: 'name' });
  const filters = { ...blankFilters('any'), ...f };
  const fileRef = useRef(null);
  const items = useMemo(() => {
    const list = Object.values(collection).filter((e) => matchesFilters(e.card, filters));
    const order = sortCards(list.map((e) => e.card), filters.sort).map((c) => c.id);
    const byId = Object.fromEntries(list.map((e) => [e.card.id, e]));
    return order.map((id) => byId[id]);
  }, [collection, f]);
  const total = Object.values(collection).reduce((n, e) => n + e.count, 0);

  const importItems = (list) => {
    const add = {};
    for (const { card, count } of list) add[card.id] = { card, count: (add[card.id]?.count ?? collection[card.id]?.count ?? 0) + count };
    return store.setOwnedMany(Object.values(add));
  };
  function backup() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(collection)], { type: 'application/json' }));
    a.download = `deck-brews-collection-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  }
  function restore(file) {
    const r = new FileReader();
    r.onload = async () => {
      try {
        const obj = JSON.parse(r.result);
        if (!confirm(`Replace the shared collection with the ${Object.keys(obj).length} cards in this backup?`)) return;
        await store.replaceCollection(obj);
      } catch { alert('That file isn’t a Deck Brews backup.'); }
    };
    r.readAsText(file);
  }
  return html`<section class="collection">
    <div class="statbar">
      <div class="count60"><b>${total}</b><span>cards in your library</span></div>
      <div class="row end">
        <button class="btn ghost" onClick=${backup} disabled=${!total}>Save backup</button>
        <button class="btn ghost" onClick=${() => fileRef.current.click()}>Load backup</button>
        <input ref=${fileRef} type="file" accept="application/json" hidden onChange=${(e) => { e.target.files[0] && restore(e.target.files[0]); e.target.value = ''; }} />
      </div>
    </div>
    <${ImportBox} title="Add cards to your library"

function inline(text) {
  const out = [];
  const re = /\*\*([^*]+)\*\*|\*([^*\s][^*]*)\*/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    out.push(m[1] != null ? html`<strong>${m[1]}</strong>` : html`<em>${m[2]}</em>`);
    last = re.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
function richText(text) {
  const blocks = [];
  let list = null, para = [];
  const flushPara = () => { if (para.length) { blocks.push(html`<p>${inline(para.join('\n'))}</p>`); para = []; } };
  const flushList = () => { if (list) { blocks.push(html`<ul>${list.map((li) => html`<li>${inline(li)}</li>`)}</ul>`); list = null; } };
  for (const raw of String(text || '').split('\n')) {
    const line = raw.trimEnd();
    const bullet = line.match(/^\s*[-*•]\s+(.*)$/);
    if (bullet) { flushPara(); (list ||= []).push(bullet[1]); }
    else if (!line.trim()) { flushPara(); flushList(); }
    else { flushList(); para.push(line); }
  }
  flushPara(); flushList();
  return blocks;
}

const STARTERS = [
  'Which cards in this deck are we missing, and what can we use from our collection instead?',
  'Explain how this deck wins, in a way a kid can follow.',
  'Build a 60-card deck around a Pokémon we own. Ask me which one first.',
];
// Bold phrases in a reply that look like card names and aren't already suggestions.
function mentionedCardNames(reply, suggestions) {
  const have = new Set(suggestions.map((x) => x.name.toLowerCase()));
  const out = [];
  for (const m of String(reply || '').matchAll(/\*\*([^*]{3,40})\*\*/g)) {
    const name = m[1].trim().replace(/[.:!,]+$/, '');
    if (name.split(/\s+/).length > 5 || /^\d/.test(name) || have.has(name.toLowerCase())) continue;
    have.add(name.toLowerCase()); out.push(name);
  }
  return out.slice(0, 6);
}
async function findMentionedCards(names, collection, deck) {
  const known = [...deck.entries.map((e) => e.card), ...Object.values(collection).map((e) => e.card), ...EXTRA_CARDS];
  const results = [];
  for (const name of names) {
    let card = known.find((c) => c.name.toLowerCase() === name.toLowerCase()) || null;
    if (!card) { try { card = await findByName(name); } catch {} }
    if (card) results.push({ action: 'show', name: card.name, count: 1, reason: 'Mentioned above.', card, done: false });
  }
  return results;
}

// Google's search-suggestion chips, kept in a shadow DOM (as Google recommends) so their styles can't affect the page.
function SearchSuggestions({ htmlText }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const root = el.shadowRoot || el.attachShadow({ mode: 'open' });
    root.innerHTML = htmlText;
    root.querySelectorAll('a').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
  }, [htmlText]);
  return html`<div class="search-chips" ref=${ref}></div>`;
}

function addNote(notes, note) {

// "Charizard" → "Charizard v2"; "Charizard v2" → "Charizard v3", skipping names already used.
function nextVersionName(name, decks) {
  const m = name.match(/^(.*?)\s+v(\d+)$/i);
  const base = m ? m[1] : name;
  let n = m ? +m[2] + 1 : 2;
  const used = new Set(decks.map((d) => d.name.toLowerCase()));
  while (used.has(`${base} v${n}`.toLowerCase())) n++;
  return `${base} v${n}`;
}

    (async () => {

        for (const e of Object.values(data.collection)) {
          const card = map[e.card.id] || e.card;

  function newDeck() { const d = blankDeck(`Deck ${decks.length + 1}`); store.saveDeck(d); setActiveId(d.id); setTab('deck'); }
  function copyDeck() {
    const name = prompt('Name for the copy:', nextVersionName(deck.name, decks));
    if (name == null || !name.trim()) return;
    const d = { ...blankDeck(name.trim()), entries: deck.entries.map((e) => ({ ...e })) };
    store.saveDeck(d); setActiveId(d.id); setTab('deck');
  }
  function deleteDeck() {
    if (!confirm(`Delete “${deck.name}” for everyone? This can’t be undone.`)) return;
    store.deleteDeck(deck.id); store.deleteChat(deck.id).catch(() => {}); setActiveId(decks.find((d) => d.id !== deck.id)?.id || null);
  }
  function commitName() {
    if (nameDraft != null && nameDraft.trim() && nameDraft.trim() !== deck.name) writeDeck({ ...deck, name: nameDraft.trim() });
    setNameDraft(null);
  }

  return html`<div class="app">
    <header class="top">
      <div class="brand">Deck Brews</div>
      <div class="deckpick">
        <select value=${deck.id} onChange=${(e) => setActiveId(e.target.value)} aria-label="Choose a deck">
          ${decks.map((d) => html`<option value=${d.id}>${d.name}</option>`)}
        </select>
        <input value=${nameDraft ?? deck.name} onInput=${(e) => setNameDraft(e.target.value)} onBlur=${commitName}
          onKeyDown=${(e) => e.key === 'Enter' && e.target.blur()} aria-label="Deck name" />
        <button class="btn ghost small" onClick=${newDeck}>New deck</button>
        <button class="btn ghost small" onClick=${copyDeck}>Copy deck</button>
        <button class="btn ghost small danger" onClick=${deleteDeck}>Delete</button>
      </div>
      <select class="format" value=${format} onChange=${(e) => setFormat(e.target.value)} aria-label="Format">
        <option value="standard">Standard</option><option value="expanded">Expanded</option><option value="casual">Casual (any cards)</option>
      </select>
      <button class="btn ghost small gear theme-toggle" onClick=${() => setTheme(isDark ? 'light' : 'dark')}
        aria-label=${isDark ? 'Switch to light mode' : 'Switch to dark mode'} title=${isDark ? 'Light mode' : 'Dark mode'}>${isDark ? '☀️' : '🌙'}</button>
      <button class="btn ghost small" onClick=${() => setSettings(true)}>Settings</button>
    </header>
    ${syncErr && html`<p class="warn small">${syncErr}</p>`}
    ${upgrade && html`<p class="muted small">${upgrade}</p>`}

    <nav class="tabs" role="tablist">
      ${[['deck', 'Deck'], ['search', 'Find cards'], ['collection', 'Card Library']].map(([k, label]) =>
        html`<button role="tab" aria-selected=${tab === k} class=${tab === k ? 'on' : ''} onClick=${() => setTab(k)}>${label}</button>`)}
    </nav>

    <div class="layout">
      <main>
        ${tab === 'deck' && html`<${DeckView} key=${deck.id} deck=${deck} collection=${collection} stats=${stats} onOpen=${setModalCard} onImport=${importToDeck} />`}
        ${tab === 'search' && html`<${SearchView} onOpen=${setModalCard} onAddDeck=${(c) => addToDeck(c)} onAddOwned=${(c) => store.setOwned(c, ownedExact(c) + 1)} ownedOf=${ownedExact} deckCountOf=${deckCountOf} onAddExtra=${(name) => setExtraForm({ name })} />`}
        ${tab === 'collection' && html`<${CollectionView} collection=${collection} store=${store} onOpen=${setModalCard} />`}
      </main>
      <${AssistantPanel} key=${deck.id} deck=${deck} collection=${collection} format=${format}
        notes=${data.coachNotes || ''} otherDecks=${describeDecks(decks, deck.id)}
        onOwned=${(card, count) => store.setOwned(card, Math.max(ownedExact(card), count))}
        store=${store} onAdd=${addToDeck} onRemove=${removeFromDeck} onOpen=${setModalCard} />
    </div>

    <p class="foot">Version ${VERSION}. ${store.mode === 'firebase' ? 'Shared with Firebase.' : 'Saved on this device only.'}</p>

    ${modalCard && html`<${CardModal} card=${modalCard} deckCount=${deckCountOf(modalCard)} ownedExact=${ownedExact(modalCard)}
      onDeck=${(n) => setDeckCount(modalCard, n)} onOwned=${(n) => store.setOwned(modalCard, n)} onClose=${() => setModalCard(null)}
      onDeleteExtra=${(c) => { if (confirm(`Remove “${c.name}” from the extra cards? Decks that use it keep their copy.`)) { store.deleteCustomCard(c.id); setModalCard(null); } }} />`}
    ${extraForm && html`<${ExtraCardForm} initialName=${extraForm.name} onClose=${() => setExtraForm(null)}
      onSave=${(c) => { store.saveCustomCard(c); setExtraForm(null); setModalCard(c); }} />`}
    ${settings && html`<${Settings} mode=${store.mode} theme=${theme} onTheme=${setTheme} localInfo=${localInfo} notes=${data.coachNotes || ''} onSaveNotes=${(t) => store.saveCoachNotes(t)} onClose=${() => setSettings(false)}
      onDisconnect=${() => { setSettings(false); setStore(null); setData({ decks: {}, collection: {}, loaded: false }); setCode(''); }} />`}
  </div>`;
}

const root = document.getElementById('app');
root.textContent = '';
render(html`<${App} />`, root);
</script>
</body>
</html>
