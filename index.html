/* ---------- Settings and family code ---------- */
function Settings({ mode, notes, onSaveNotes, onClose, onDisconnect, theme, onTheme, localInfo }) {
  const [draft, setDraft] = useState(notes || '');
  const [saved, setSaved] = useState(false);
  useEscape(onClose);
  async function saveNotes() { await onSaveNotes(draft); setSaved(true); setTimeout(() => setSaved(false), 2000); }
  return html`<div class="scrim" onClick=${onClose}>
    <div class="modal settings" role="dialog" aria-modal="true" aria-label="Settings" onClick=${(e) => e.stopPropagation()}>
      <h2>Settings</h2>
      <label for="cn">Coach notes</label>
      <p class="muted small">Things the coach should always remember, for every deck. One per line works well. The coach can also offer to add notes when you mention a preference in chat.</p>
      <textarea id="cn" rows="6" maxlength=${NOTES_LIMIT} value=${draft} onInput=${(e) => setDraft(e.target.value)}
        placeholder=${'- My son is 9, so explain things simply.\n- We play casual games at home.\n- He loves Fire-type Pokémon.\n- Build from cards we own; we don’t buy singles.'}></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn" disabled=${draft === (notes || '')} onClick=${saveNotes}>${saved ? 'Saved' : 'Save notes'}</button>
        <span class="small muted">${draft.length} / ${NOTES_LIMIT}</span>
      </div>
      <hr class="divider" />
      <label for="th">Theme</label>
      <select id="th" value=${theme} onChange=${(e) => onTheme(e.target.value)}>
        <option value="system">Match this device</option><option value="light">Light</option><option value="dark">Dark</option>
      </select>
      <p class="muted small">Saved on this device only.</p>
      <hr class="divider" />
      <p class="small">${mode === 'firebase' ? html`<b>Shared with Firebase.</b> Decks, cards, chats and coach notes sync across your devices.` : 'Saved on this device only. Fill in firebase-config.js to share across devices.'}</p>
      <p class="small">${COACH_READY ? html`<b>Deck coach is on</b> (Google Gemini, free tier: ${currentCoachModel()}).` : 'Deck coach is off until AI Logic and App Check are set up (SETUP.md, step 2). Copy for Claude still works.'}</p>
      <p class="small">Card data and images come from <a href="https://tcgdex.dev" target="_blank" rel="noopener">TCGdex</a>, a free, open-source card database.
        ${localInfo ? html` <b>Saved card data:</b> ${localInfo.cards.length.toLocaleString()} cards, updated ${localInfo.updated} (refreshed weekly).`
          : ' The saved copy of the card data hasn’t been created yet, so cards load live from TCGdex (see SETUP.md, step 5).'}</p>
      <div class="row" style="margin-top:16px">
        <button class="btn ghost" onClick=${onClose}>Close</button>
        ${mode === 'firebase' && html`<button class="btn ghost danger" onClick=${onDisconnect}>Forget family code</button>`}
      </div>
    </div>
  </div>`;
}

function Connect({ onConnect, error, busy }) {
  const [code, setCode] = useState(''), [show, setShow] = useState(false);
  return html`<form class="connect" onSubmit=${(e) => { e.preventDefault(); code.trim() && onConnect(code.trim().toLowerCase()); }}>
    <h1>Deck Brews</h1>
    <p class="muted">Enter your family code to open your shared decks and cards.</p>
    <label for="fc">Family code</label>
    <div class="pw"><input id="fc" type=${show ? 'text' : 'password'} value=${code} onInput=${(e) => setCode(e.target.value)} autocapitalize="off" autocomplete="off" spellcheck="false" />
      <button type="button" class="btn ghost small" onClick=${() => setShow(!show)}>${show ? 'Hide' : 'Show'}</button></div>
    ${error && html`<p class="warn small">${error}</p>`}
    <div class="row" style="margin-top:16px"><button class="btn" disabled=${busy || !code.trim()}>${busy ? 'Connecting…' : 'Open our decks'}</button></div>
  </form>`;
}

/* ---------- App ---------- */
// "Charizard" → "Charizard v2"; "Charizard v2" → "Charizard v3", skipping names already used.
function nextVersionName(name, decks) {
  const m = name.match(/^(.*?)\s+v(\d+)$/i);
  const base = m ? m[1] : name;
  let n = m ? +m[2] + 1 : 2;
  const used = new Set(decks.map((d) => d.name.toLowerCase()));
  while (used.has(`${base} v${n}`.toLowerCase())) n++;
  return `${base} v${n}`;
}
const blankDeck = (name) => ({ id: makeId(), name, entries: [], createdAt: Date.now(), updatedAt: Date.now() });

function App() {
  const [code, setCode] = usePref('db.familyCode', '');
  const [store, setStore] = useState(null);
  const [connErr, setConnErr] = useState(null), [connecting, setConnecting] = useState(false);
  const [data, setData] = useState({ decks: {}, collection: {}, loaded: false });
  const [syncErr, setSyncErr] = useState(null);
  const [activeId, setActiveId] = usePref('db.active', null);
  const [format, setFormat] = usePref('db.format', 'standard');
  const [tab, setTab] = useState('deck');
  const [modalCard, setModalCard] = useState(null);
  const [settings, setSettings] = useState(false);
  const [nameDraft, setNameDraft] = useState(null);
  const [coachPrompt, setCoachPrompt] = useState(null);
  const askCoachFrom = (text, web = false) => setCoachPrompt({ id: Date.now(), text, web });
  const [theme, setTheme] = usePref('db.theme', 'system');
  const [localInfo, setLocalInfo] = useState(LOCAL);
  useEffect(() => { localReady.then((l) => setLocalInfo(l)); }, []);
  useEffect(() => applyTheme(theme), [theme]);
  const isDark = theme === 'dark' || (theme === 'system' && systemDark());
  const [extraForm, setExtraForm] = useState(null);

  // Connect to Firebase (or fall back to this device only).
  useEffect(() => {
    if (!FIREBASE_READY) { setStore(createLocalStore()); return; }
    if (!code) return;
    let cancelled = false;
    setConnecting(true); setConnErr(null);
    createFirebaseStore(code)
      .then((s) => { if (!cancelled) setStore(s); })
      .catch((e) => { if (!cancelled) { setConnErr(e.message); setCode(''); } })
      .finally(() => !cancelled && setConnecting(false));
    return () => { cancelled = true; };
  }, [code]);

  useEffect(() => { if (!store) return; return store.subscribe((d) => { setData(d); setSyncErr(null); }, setSyncErr); }, [store]);

  const decks = useMemo(() => Object.values(data.decks).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)), [data.decks]);

  // One-time upgrade of cards saved from the old card database (before 1.2.0).
  const [upgrade, setUpgrade] = useState(null);
  const upgradeTried = useRef(false);
  useEffect(() => {
    if (!store || !data.loaded || upgradeTried.current) return;
    const legacy = {};
    for (const e of Object.values(data.collection)) if (isLegacyCard(e.card)) legacy[e.card.id] = e.card;
    for (const d of Object.values(data.decks)) for (const e of d.entries) if (isLegacyCard(e.card)) legacy[e.card.id] = e.card;
    const list = Object.values(legacy);
    upgradeTried.current = true;
    if (!list.length) return;
    setUpgrade(`Updating ${list.length} saved card${list.length === 1 ? '' : 's'} to the new card database…`);
    (async () => {
      try {
        const map = await upgradeLegacyCards(list);
        const merged = {};
        const deletions = [];
        for (const e of Object.values(data.collection)) {
          const card = map[e.card.id] || e.card;
          if (card.id !== e.card.id) deletions.push({ card: e.card, count: 0 });
          merged[card.id] = { card, count: (merged[card.id]?.count || 0) + e.count };
        }
        if (deletions.length) await store.setOwnedMany([...deletions, ...Object.values(merged)]);
        for (const d of Object.values(data.decks)) {
          if (!d.entries.some((e) => map[e.card.id])) continue;
          const m = new Map();
          for (const e of d.entries) { const card = map[e.card.id] || e.card; m.set(card.id, { card, count: (m.get(card.id)?.count || 0) + e.count }); }
          await store.saveDeck({ ...d, entries: [...m.values()], updatedAt: Date.now() });
        }
        const missed = list.length - Object.keys(map).length;
        setUpgrade(missed ? `Updated your saved cards. ${missed} couldn’t be matched and still use their old pictures.` : null);
      } catch { setUpgrade('Couldn’t update saved cards to the new card database right now. It will try again next time.'); upgradeTried.current = false; }
    })();
  }, [store, data.loaded]);

  // Make a first deck once everything has loaded and there are none.
  useEffect(() => { if (store && data.loaded && decks.length === 0) store.saveDeck(blankDeck('My first deck')); }, [store, data.loaded, decks.length]);

  if (FIREBASE_READY && !store) return html`<${Connect} onConnect=${setCode} error=${connErr} busy=${connecting} />`;
  if (!data.loaded || !decks.length) return html`<div class="loading">Opening your decks…</div>`;

  const collection = data.collection;
  const wantCount = Object.values(data.wants || {}).reduce((n, w) => n + w.count, 0);
  EXTRA_CARDS = [...BUILT_IN_EXTRAS, ...Object.values(data.customCards || {})];
  const deck = decks.find((d) => d.id === activeId) || decks[0];
  const stats = analyzeDeck(deck.entries, collection, format);
  const writeDeck = (d) => store.saveDeck({ ...d, updatedAt: Date.now() });

  const deckCountOf = (card) => deck.entries.find((e) => e.card.id === card.id)?.count || 0;
  const setDeckCount = (card, count) => {
    const exists = deck.entries.some((e) => e.card.id === card.id);
    const entries = exists ? deck.entries.map((e) => (e.card.id === card.id ? { ...e, count } : e)) : [...deck.entries, { card, count }];
    writeDeck({ ...deck, entries: entries.filter((e) => e.count > 0) });
  };
  const addToDeck = (card, n = 1) => setDeckCount(card, deckCountOf(card) + n);
  const removeFromDeck = (card, n = 1) => {
    const e = deck.entries.find((x) => x.card.id === card.id) || deck.entries.find((x) => x.card.name === card.name);
    if (e) setDeckCount(e.card, Math.max(0, e.count - n));
  };
  const importToDeck = (items, mode) => {
    const map = new Map(mode === 'replace' ? [] : deck.entries.map((e) => [e.card.id, { ...e }]));
    for (const { card, count } of items) map.set(card.id, { card, count: (map.get(card.id)?.count || 0) + count });
    return writeDeck({ ...deck, entries: [...map.values()] });
  };
  const ownedExact = (card) => collection[card.id]?.count || 0;

  // Move this deck's copies and the library's copies of one printing over to another.
  async function switchVersion(from, to) {
    const inDeck = deckCountOf(from), inLib = ownedExact(from);
    if (!inDeck && !inLib) { setModalCard(to); return; }
    const parts = [inDeck && `${inDeck} in this deck`, inLib && `${inLib} in your Card Library`].filter(Boolean).join(' and ');
    if (!confirm(`Switch to ${to.name} (${to.setCode} ${to.number})? This moves ${parts} to that version.`)) { setModalCard(to); return; }
    if (inDeck) {
      const rest = deck.entries.filter((e) => e.card.id !== from.id);
      const entries = rest.some((e) => e.card.id === to.id)
        ? rest.map((e) => (e.card.id === to.id ? { ...e, count: e.count + inDeck } : e))
        : [...rest, { card: to, count: inDeck }];
      await writeDeck({ ...deck, entries });
    }
    if (inLib) await store.setOwnedMany([{ card: from, count: 0 }, { card: to, count: ownedExact(to) + inLib }]);
    setModalCard(to);
  }
  function newDeck() { const d = blankDeck(`Deck ${decks.length + 1}`); store.saveDeck(d); setActiveId(d.id); setTab('deck'); }
  function copyDeck() {
    const name = prompt('Name for the copy:', nextVersionName(deck.name, decks));
    if (name == null || !name.trim()) return;
    const d = { ...blankDeck(name.trim()), entries: deck.entries.map((e) => ({ ...e })) };
    store.saveDeck(d); setActiveId(d.id); setTab('deck');
  }
  function deleteDeck() {
    if (!confirm(`Delete “${deck.name}” for everyone? This can’t be undone.`)) return;
    store.deleteDeck(deck.id); store.deleteChat(deck.id).catch(() => {}); setActiveId(decks.find((d) => d.id !== deck.id)?.id || null);
  }
  function commitName() {
    if (nameDraft != null && nameDraft.trim() && nameDraft.trim() !== deck.name) writeDeck({ ...deck, name: nameDraft.trim() });
    setNameDraft(null);
  }

  return html`<div class="app">
    <header class="top">
      <div class="brand">Deck Brews</div>
      <div class="deckpick">
        <select value=${deck.id} onChange=${(e) => setActiveId(e.target.value)} aria-label="Choose a deck">
          ${decks.map((d) => html`<option value=${d.id}>${d.name}</option>`)}
        </select>
        <input value=${nameDraft ?? deck.name} onInput=${(e) => setNameDraft(e.target.value)} onBlur=${commitName}
          onKeyDown=${(e) => e.key === 'Enter' && e.target.blur()} aria-label="Deck name" />
        <button class="btn ghost small" onClick=${newDeck}>New deck</button>
        <button class="btn ghost small" onClick=${copyDeck}>Copy deck</button>
        <button class="btn ghost small danger" onClick=${deleteDeck}>Delete</button>
      </div>
      <select class="format" value=${format} onChange=${(e) => setFormat(e.target.value)} aria-label="Format">
        <option value="standard">Standard</option><option value="expanded">Expanded</option><option value="casual">Casual (any cards)</option>
      </select>
      <button class="btn ghost small gear theme-toggle" onClick=${() => setTheme(isDark ? 'light' : 'dark')}
        aria-label=${isDark ? 'Switch to light mode' : 'Switch to dark mode'} title=${isDark ? 'Light mode' : 'Dark mode'}>${isDark ? '☀️' : '🌙'}</button>
      <button class="btn ghost small" onClick=${() => setSettings(true)}>Settings</button>
    </header>
    ${syncErr && html`<p class="warn small">${syncErr}</p>`}
    ${upgrade && html`<p class="muted small">${upgrade}</p>`}

    <nav class="tabs" role="tablist">
      ${[['deck', 'Deck'], ['search', 'Find cards'], ['collection', 'Card Library'], ['wants', `Want list${wantCount ? ` (${wantCount})` : ''}`]].map(([k, label]) =>
        html`<button role="tab" aria-selected=${tab === k} class=${tab === k ? 'on' : ''} onClick=${() => setTab(k)}>${label}</button>`)}
    </nav>

    <div class="layout">
      <main>
        ${tab === 'deck' && html`<${DeckView} key=${deck.id} deck=${deck} decks=${decks} collection=${collection} format=${format} onAsk=${askCoachFrom} stats=${stats} onOpen=${setModalCard} onImport=${importToDeck} />`}
        ${tab === 'search' && html`<${SearchView} onOpen=${setModalCard} onAddDeck=${(c) => addToDeck(c)} onAddOwned=${(c) => store.setOwned(c, ownedExact(c) + 1)} ownedOf=${ownedExact} deckCountOf=${deckCountOf} onAddExtra=${(name) => setExtraForm({ name })} />`}
        ${tab === 'collection' && html`<${CollectionView} collection=${collection} store=${store} onOpen=${setModalCard} />`}
        ${tab === 'wants' && html`<${WantListView} decks=${decks} collection=${collection} wants=${data.wants || {}} store=${store} onOpen=${setModalCard} />`}
      </main>
      <${AssistantPanel} key=${deck.id} deck=${deck} collection=${collection} format=${format} prompt=${coachPrompt}
        notes=${data.coachNotes || ''} otherDecks=${describeDecks(decks, deck.id)}
        onOwned=${(card, count) => store.setOwned(card, Math.max(ownedExact(card), count))} wants=${data.wants || {}}
        store=${store} onAdd=${addToDeck} onRemove=${removeFromDeck} onOpen=${setModalCard} />
    </div>

    <p class="foot">Version ${VERSION}. ${store.mode === 'firebase' ? 'Shared with Firebase.' : 'Saved on this device only.'}</p>

    ${modalCard && html`<${CardModal} card=${modalCard} deckCount=${deckCountOf(modalCard)} ownedExact=${ownedExact(modalCard)}
      wantCount=${data.wants?.[modalCard.id]?.count || 0} onWant=${(n) => store.setWant(modalCard, n)}
      onDeck=${(n) => setDeckCount(modalCard, n)} onOwned=${(n) => store.setOwned(modalCard, n)} onClose=${() => setModalCard(null)}
      onSwitchVersion=${switchVersion}
      onDeleteExtra=${(c) => { if (confirm(`Remove “${c.name}” from the extra cards? Decks that use it keep their copy.`)) { store.deleteCustomCard(c.id); setModalCard(null); } }} />`}
    ${extraForm && html`<${ExtraCardForm} initialName=${extraForm.name} onClose=${() => setExtraForm(null)}
      onSave=${(c) => { store.saveCustomCard(c); setExtraForm(null); setModalCard(c); }} />`}
    ${settings && html`<${Settings} mode=${store.mode} theme=${theme} onTheme=${setTheme} localInfo=${localInfo} notes=${data.coachNotes || ''} onSaveNotes=${(t) => store.saveCoachNotes(t)} onClose=${() => setSettings(false)}
      onDisconnect=${() => { setSettings(false); setStore(null); setData({ decks: {}, collection: {}, loaded: false }); setCode(''); }} />`}
  </div>`;
}

const root = document.getElementById('app');
root.textContent = '';
render(html`<${App} />`, root);
</script>
</body>
</html>
