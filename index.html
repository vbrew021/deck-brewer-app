<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deck Brews</title>
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#24315C" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Deck Brews" />
<meta name="color-scheme" content="light dark" />
<script>
  // Apply the saved theme before the page draws, so dark mode doesn't flash white.
  try { var t = JSON.parse(localStorage.getItem('db.theme') || '"system"'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --page: #E9EEF5;      /* cool desk surface */
  --paper: #FFFFFF;
  --ink: #1A2340;
  --muted: #5E6886;
  --binder: #24315C;    /* binder sheet */
  --pocket: #2F3E70;
  --line: #CDD5E3;
  --pokemon: #8B5CD6;   /* section colors */
  --trainer: #2F74C9;
  --energy: #D99A12;
  --have: #23905A;
  --short: #D9771E;
  --need: #C23B33;
  --focus: #F2C230;
  color-scheme: light;
  --btn: #24315C;
  --btn-hover: #1A2548;
  --field: #F7F9FC;
  --soft: #F4F6FA;
  --soft-hover: #E5EBF4;
  --tile-bg: #D9E0EC;
  --warn-bg: #FFF3E6;
  --warn-ink: #7A3E06;
  --note-bg: #FFF6DB;
  --scrim: rgba(16, 22, 44, .6);
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Lexend', 'Segoe UI', system-ui, sans-serif;
}
/* Dark mode: follows the device unless a theme is chosen in Settings */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  color-scheme: dark;
  --page: #0E1322;
  --paper: #172036;
  --ink: #E6EBF5;
  --muted: #9AA6C2;
  --binder: #22305A;
  --pocket: #2C3B6B;
  --line: #2C3954;
  --pokemon: #A98BEA;
  --trainer: #6EA6F2;
  --energy: #E8B33A;
  --have: #3DBE7A;
  --short: #F0A04B;
  --need: #F07068;
  --btn: #3F5BB8;
  --btn-hover: #4D6AC9;
  --field: #10182B;
  --soft: #1E2942;
  --soft-hover: #26334F;
  --tile-bg: #26334F;
  --warn-bg: #3A2A14;
  --warn-ink: #F5C58A;
  --note-bg: #3A3216;
  --scrim: rgba(3, 6, 14, .72);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0E1322;
  --paper: #172036;
  --ink: #E6EBF5;
  --muted: #9AA6C2;
  --binder: #22305A;
  --pocket: #2C3B6B;
  --line: #2C3954;
  --pokemon: #A98BEA;
  --trainer: #6EA6F2;
  --energy: #E8B33A;
  --have: #3DBE7A;
  --short: #F0A04B;
  --need: #F07068;
  --btn: #3F5BB8;
  --btn-hover: #4D6AC9;
  --field: #10182B;
  --soft: #1E2942;
  --soft-hover: #26334F;
  --tile-bg: #26334F;
  --warn-bg: #3A2A14;
  --warn-ink: #F5C58A;
  --note-bg: #3A3216;
  --scrim: rgba(3, 6, 14, .72);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
.theme-toggle { font-size: 16px; line-height: 1; padding: 6px 10px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; letter-spacing: -0.01em; }
.muted { color: var(--muted); } .small { font-size: 13px; } .warn { color: var(--need); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .row.end { margin-left: auto; }
.loading { display: grid; place-items: center; min-height: 100vh; color: var(--muted); }

/* Buttons */
.btn { background: var(--btn); color: #fff; border: 0; border-radius: var(--r-sm); padding: 8px 14px; font-weight: 600; cursor: pointer; }
.btn:hover:not(:disabled) { background: var(--btn-hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.ghost:hover:not(:disabled) { background: var(--paper); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.danger { color: var(--need); }
.mini { border: 0; background: var(--btn); color: #fff; border-radius: var(--r-sm); padding: 4px 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
.mini.ghost { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.mini:disabled { background: var(--have); opacity: 1; cursor: default; }

/* Header */
.app { max-width: 1440px; margin: 0 auto; padding: 16px 20px 40px; }
.top { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; font-size: 24px; }
.deckpick { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex: 1; }
.deckpick select, .deckpick input, .format, .searchbar input, .searchbar select {
  background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 7px 10px;
}
.deckpick input { font-weight: 600; min-width: 180px; }
.tabs { display: flex; gap: 4px; margin: 18px 0 14px; border-bottom: 2px solid var(--line); }
.tabs button { background: none; border: 0; padding: 10px 16px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs button.on { color: var(--ink); border-color: var(--binder); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

/* Stat bar */
.statbar { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; background: var(--paper); border-radius: var(--r-md); padding: 12px 16px; margin-bottom: 12px; }
.count60 { display: flex; align-items: baseline; gap: 4px; }
.count60 b { font-family: var(--display); font-size: 32px; line-height: 1; }
.count60 span { color: var(--muted); }
.count60.done b { color: var(--have); }
.split { display: flex; gap: 14px; font-weight: 600; font-size: 14px; }
.split span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: currentColor; }
.sec-pokemon.split, .split .sec-pokemon { color: var(--pokemon); }
.split .sec-trainer { color: var(--trainer); }
.split .sec-energy { color: var(--energy); }
.missing { font-weight: 600; color: var(--short); }
.missing.none { color: var(--have); }
.issues { margin: 0 0 12px; padding: 10px 14px 10px 30px; background: var(--warn-bg); border-radius: var(--r-md); color: var(--warn-ink); font-size: 14px; }

/* Binder sheets: the deck's signature look */
.binder { background: var(--binder); border-radius: var(--r-lg); padding: 14px 16px 18px; margin-bottom: 16px; border-left: 8px solid var(--accent); }
.binder.sec-pokemon { --accent: var(--pokemon); }
.binder.sec-trainer { --accent: var(--trainer); }
.binder.sec-energy { --accent: var(--energy); }
.binder h3 { color: #fff; font-size: 18px; margin-bottom: 12px; display: flex; gap: 10px; align-items: baseline; }
.binder h3 span { font-family: var(--body); font-size: 14px; font-weight: 600; color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

.tile { display: flex; flex-direction: column; gap: 6px; }
.pocket { position: relative; display: block; padding: 4px; border: 0; border-radius: var(--r-md); background: var(--pocket); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); cursor: pointer; aspect-ratio: 63 / 88; }
.search .pocket, .collection .pocket, .assistant .pocket { background: var(--tile-bg); }
.pocket img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 7px; }
.pocket:hover img { transform: translateY(-2px); transition: transform .15s; }
@media (prefers-reduced-motion: reduce) { .pocket:hover img { transform: none; } }
.noimg { display: grid; place-items: center; height: 100%; color: #fff; font-size: 12px; padding: 6px; }
.qty { position: absolute; top: -6px; left: -6px; min-width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: #fff; color: #1A2340; font-family: var(--display); font-weight: 800; font-size: 16px; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.own { position: absolute; left: 6px; right: 6px; bottom: 6px; text-align: center; font-size: 11px; font-weight: 600; color: #fff; border-radius: 4px; padding: 1px 4px; }
.own-have { background: var(--have); } .own-short { background: var(--short); } .own-need { background: var(--need); }
.tile-actions { display: flex; gap: 6px; justify-content: center; }
.empty { background: var(--paper); border-radius: var(--r-md); padding: 28px; text-align: center; color: var(--muted); }

/* Import, search */
.import { background: var(--paper); border-radius: var(--r-md); padding: 14px 16px; margin-bottom: 14px; }
.import h3 { font-size: 17px; }
.import p { margin: 4px 0 10px; }
textarea { width: 100%; border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 10px; resize: vertical; background: var(--field); font-size: 14px; }
.import textarea { margin-bottom: 10px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.searchbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.searchbar input { flex: 1; min-width: 200px; }
.check { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.searchbar input[type="checkbox"], .check input[type="checkbox"] { flex: none; min-width: 0; width: auto; }
.more { display: block; margin: 16px auto 0; }

/* Assistant */
.assistant { position: sticky; top: 16px; background: var(--paper); border-radius: var(--r-lg); display: flex; flex-direction: column; max-height: calc(100vh - 32px); border-top: 6px solid var(--binder); }
@media (max-width: 980px) { .assistant { position: static; max-height: none; } }
.assistant header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 8px; }
.assistant h2 { font-size: 20px; }
.thread { flex: 1; overflow-y: auto; padding: 4px 16px 12px; min-height: 240px; }
.starters { display: flex; flex-direction: column; gap: 8px; }
.starter { text-align: left; background: var(--soft); border: 0; border-radius: var(--r-md); padding: 10px 12px; cursor: pointer; font-size: 14px; }
.starter:hover { background: var(--soft-hover); }
.msg { margin: 12px 0; }
.msg p { margin: 0 0 8px; white-space: pre-wrap; }
.msg p:last-child { margin-bottom: 0; }
.msg-user p { background: var(--btn); color: #fff; padding: 9px 12px; border-radius: var(--r-md) var(--r-md) 2px var(--r-md); margin-left: 28px; }
.msg-coach { font-size: 14.5px; }
.msg-coach ul { margin: 0 0 8px; padding-left: 20px; }
.msg-coach li { margin: 2px 0; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--trainer); font-weight: 600; cursor: pointer; text-decoration: underline; }
.noimg small { opacity: .8; }
.noimg.big { display: grid; place-items: center; aspect-ratio: 63 / 88; background: var(--pocket); color: #fff; border-radius: 12px; padding: 12px; text-align: center; font-weight: 600; }
.sugg.show { border-left-color: var(--trainer); }
.sugg-status { font-size: 12px; font-weight: 600; color: var(--muted); }
.sugg-status.ok { color: var(--have); }
.remember { margin-top: 10px; padding: 10px 12px; border-radius: var(--r-md); background: var(--note-bg); display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 18px 0 8px; }
.settings textarea { font-size: 14px; }
.sugg-group { margin: 6px 0 -2px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.sources { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-top: 8px; font-size: 13px; }
.sources a { color: var(--trainer); }
.search-chips { margin-top: 6px; max-width: 100%; overflow-x: auto; }
.composer { flex-wrap: wrap; }
.webtoggle { order: 3; width: 100%; font-size: 13px; color: var(--muted); }
.filters { margin-bottom: 14px; }
.filters .searchbar { margin-bottom: 8px; }
.filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 12px; background: var(--paper); border-radius: var(--r-md); padding: 12px 14px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld.end { justify-content: flex-end; }
.fld label { font-size: 12px; font-weight: 600; color: var(--muted); }
.fld input, .fld select { background: var(--field); border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 7px 9px; width: 100%; }
.range { display: flex; align-items: center; gap: 6px; } .range span { font-size: 12px; color: var(--muted); }
.btn.has-filters { box-shadow: inset 0 0 0 2px var(--trainer); color: var(--trainer); }
.result-count { margin: 6px 2px 0; }
.prices { margin: 14px 0 4px; padding: 10px 12px; background: var(--soft); border-radius: var(--r-md); }
.prices-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.tcgp { color: var(--trainer); font-weight: 600; font-size: 14px; }
.price-table { overflow-x: auto; }
.prices table { border-collapse: collapse; width: 100%; font-size: 13px; }
.prices th, .prices td { padding: 4px 6px; text-align: right; white-space: nowrap; }
.prices thead th { color: var(--muted); font-weight: 600; }
.prices tbody th { text-align: left; font-weight: 600; }
.prices tbody tr + tr { border-top: 1px solid var(--line); }
.shared { margin: 0 0 12px; padding: 10px 14px; background: var(--soft); border-radius: var(--r-md); border-left: 4px solid var(--short); font-size: 14px; }
.shared summary { cursor: pointer; }
.shared ul { margin: 8px 0 4px; padding-left: 20px; }
.shared li { margin: 3px 0; }
.scan-results { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.scan-row { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: start; padding: 8px; border-radius: var(--r-md); background: var(--soft); }
.scan-row.off { opacity: .55; }
.scan-body { display: flex; flex-direction: column; gap: 6px; }
.scan-body .stepper { min-width: 180px; }
.modal.tester { display: block; max-width: 860px; }
.tester-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.draw-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.draw-row.prizes { padding: 8px; border-radius: var(--r-md); background: var(--soft); }
.draw-card { padding: 0; border: 0; background: var(--tile-bg); border-radius: 6px; aspect-ratio: 63 / 88; cursor: pointer; overflow: hidden; }
.draw-card img { width: 100%; height: 100%; object-fit: contain; display: block; }
.draw-card .noimg { color: var(--muted); }
.odds { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.odds h3 { font-size: 17px; margin-bottom: 6px; }
.odds .fld { max-width: 320px; margin: 8px 0; }
.odds-list { margin: 6px 0; padding-left: 20px; }
.picker-scrim { z-index: 20; }
.modal.picker { display: block; max-width: 900px; }
.version-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); margin-top: 6px; }
.version { display: flex; flex-direction: column; gap: 4px; align-items: stretch; text-align: left; padding: 6px; border: 2px solid transparent; border-radius: var(--r-md); background: var(--soft); cursor: pointer; }
.version:hover { border-color: var(--line); }
.version.current { border-color: var(--trainer); }
.version-img { display: block; aspect-ratio: 63 / 88; background: var(--tile-bg); border-radius: 6px; overflow: hidden; }
.version-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.version-img .noimg { color: var(--muted); }
.version-name { font-weight: 600; font-size: 13px; }
.version-tag { color: var(--trainer); font-weight: 600; }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--paper); border-radius: var(--r-md); margin-bottom: 12px; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: var(--r-sm); font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--btn); color: #fff; }
.progress { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 14px; }
.progress-bar { height: 10px; background: var(--paper); border-radius: 99px; overflow: hidden; }
.progress-bar span { display: block; height: 100%; background: var(--have); }
.check-tile.missing .pocket { opacity: .45; }
.check-num { min-width: 34px; text-align: center; color: var(--muted); }
.want-total { font-size: 14px; }
.want-controls { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
.want-controls select { background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 7px 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; background: var(--paper); border: 1.5px solid var(--line); font-size: 13px; cursor: pointer; }
.chip.on { border-color: var(--trainer); }
.chip input { margin: 0; }
.want-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.want-row { display: grid; grid-template-columns: 90px 1fr; gap: 12px; padding: 10px; background: var(--paper); border-radius: var(--r-md); }
.want-body { display: flex; flex-direction: column; gap: 4px; }
.compare td, .compare th { text-align: left; }
.compare tr.more td:last-child { color: var(--need); }
.compare tr.less td:last-child { color: var(--have); }
.checks { list-style: none; margin: 10px 0 16px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checks li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: var(--r-md); background: var(--soft); }
.checks p { margin: 2px 0 0; }
.check-icon { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-weight: 800; color: #fff; }
.checks li.ok .check-icon { background: var(--have); }
.checks li.warn .check-icon { background: var(--short); }
.matchup-opt { padding: 12px 14px; border-radius: var(--r-md); background: var(--soft); margin: 10px 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.matchup-opt p { margin: 0; }
.matchup-opt .searchbar { width: 100%; margin: 0; }
.deck-image { width: 100%; height: auto; border-radius: var(--r-md); display: block; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
a.btn.disabled { opacity: .5; pointer-events: none; }
.chat-note { text-align: center; font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
.thinking { color: var(--muted); font-style: italic; }
.suggest { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.sugg { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: start; padding: 8px; border-radius: var(--r-md); background: var(--soft); border-left: 4px solid var(--have); }
.sugg.remove { border-left-color: var(--need); }
.sugg-body { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.ghosted { aspect-ratio: 63/88; background: var(--tile-bg); border-radius: var(--r-sm); display: grid; place-items: center; font-size: 11px; text-align: center; padding: 4px; }
.composer { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line); align-items: flex-end; }
.composer textarea { flex: 1; }
.composer-actions { display: flex; flex-direction: column; gap: 6px; }
.claude-hint { margin: 0; padding: 0 16px 14px; }
.claude-hint a { color: var(--trainer); font-weight: 600; }

/* Modal */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 10; }
.modal { background: var(--paper); border-radius: var(--r-lg); display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 20px; padding: 20px; max-width: 760px; width: 100%; max-height: 92vh; overflow: auto; }
@media (max-width: 640px) { .modal { grid-template-columns: 1fr; } .modal-img { max-width: 260px; margin: 0 auto; } }
.modal-img { width: 100%; border-radius: 12px; }
.modal-body h2 { font-size: 24px; }
.modal-body p { margin: 4px 0; }
.legal { font-weight: 600; font-size: 14px; } .legal.ok { color: var(--have); } .legal.no { color: var(--need); }
.cardtext { margin: 10px 0; font-size: 14px; }
.cardtext p { margin: 2px 0 0; color: var(--muted); }
.modal-controls { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
.stepper { display: flex; align-items: center; gap: 8px; }

async function gql(query, variables = {}) {

const stripZeros = (n) => (/^\d+$/.test(n) ? String(parseInt(n, 10)) : n);

function slimCard(c) {

async function searchTcgdex(f, extras) {

  if (f.trainer) { tf.trainerType = `eq:${TRAINER_TCGDEX[f.trainer]}`; tf.category = 'eq:Trainer'; }
  if (f.energyKind) { tf.energyType = f.energyKind === 'Basic' ? 'eq:Normal|Basic' : 'eq:Special'; tf.category = 'eq:Energy'; }

    if (!ids) throw new Error(`Unknown set code “${f.set.trim()}”. Try a code like TWM or MEG.`);

}

/* ---------- Deck rules ---------- */
const sectionOf = (c) => (c.supertype?.startsWith('Pok') ? 'pokemon' : c.supertype === 'Trainer' ? 'trainer' : 'energy');
const isBasicEnergy = (c) => c.supertype === 'Energy' && c.subtypes.includes('Basic');
const TRAINER_ORDER = ['Supporter', 'Item', 'Pokémon Tool', 'Stadium'];

function sortEntries(list) {
  return [...list].sort((a, b) => {
    const s = sectionOf(a.card);
    if (s === 'trainer') return tRank(a.card) - tRank(b.card) || b.count - a.count;
    if (s === 'energy') return isBasicEnergy(a.card) - isBasicEnergy(b.card) || b.count - a.count;
    return 0;
  });
}
const printKey = (c) => (sectionOf(c) === 'pokemon' ? `${c.name}|${c.attacks.map((a) => a.name).join(',')}` : c.name);

function deckUsage(decks) {
  const use = {};
  for (const d of decks) for (const e of d.entries) {
    if (isBasicEnergy(e.card)) continue;
    const k = printKey(e.card);
    (use[k] ||= { total: 0, decks: [] });
    use[k].total += e.count;
    const row = use[k].decks.find((x) => x.id === d.id);
    if (row) row.count += e.count; else use[k].decks.push({ id: d.id, name: d.name, count: e.count });
  }
  return use;
}

function sharedConflicts(deck, decks, collection) {
  const use = deckUsage(decks);
  const seen = new Set(), out = [];
  for (const e of deck.entries) {
    if (isBasicEnergy(e.card)) continue;
    const k = printKey(e.card);
    if (seen.has(k)) continue; seen.add(k);
    const u = use[k];
    const owned = ownedCount(e.card, collection);
    if (u && u.decks.length > 1 && u.total > owned) out.push({ card: e.card, owned, total: u.total, decks: u.decks });
  }
  return out;
}
function ownedCount(card, coll) {
  const k = printKey(card); let n = 0;
  for (const e of Object.values(coll)) if (e.card.id === card.id || printKey(e.card) === k) n += e.count;
  return n;
}
function analyzeDeck(entries, coll, format) {
  const counts = { pokemon: 0, trainer: 0, energy: 0 }, byName = {}, illegal = [];
  let missing = 0, ace = 0, radiant = 0;
  for (const { card, count } of entries) {
    counts[sectionOf(card)] += count;
    if (!isBasicEnergy(card)) byName[card.name] = (byName[card.name] || 0) + count;
    if (card.subtypes.includes('ACE SPEC')) ace += count;
    if (card.subtypes.includes('Radiant')) radiant += count;
    if ((format === 'standard' && !card.standard) || (format === 'expanded' && !card.expanded)) illegal.push(card.name);
    missing += Math.max(0, count - ownedCount(card, coll));
  }
  const total = counts.pokemon + counts.trainer + counts.energy, issues = [];
  const s = (n) => (n === 1 ? '' : 's');
  if (total !== 60) issues.push(total < 60 ? `Add ${60 - total} more card${s(60 - total)} to reach 60.` : `Remove ${total - 60} card${s(total - 60)} to get down to 60.`);
  for (const [n, c] of Object.entries(byName)) if (c > 4) issues.push(`${n}: ${c} copies (limit is 4).`);
  if (total && !entries.some((e) => sectionOf(e.card) === 'pokemon' && e.card.subtypes.includes('Basic'))) issues.push('The deck needs at least one Basic Pokémon.');
  if (ace > 1) issues.push(`${ace} ACE SPEC cards (limit is 1).`);
  if (radiant > 1) issues.push(`${radiant} Radiant Pokémon (limit is 1).`);
  for (const n of new Set(illegal)) issues.push(`${n} isn’t legal in ${format === 'standard' ? 'Standard' : 'Expanded'}.`);
  return { total, counts, missing, issues };
}

/* ---------- Decklist text (Limitless / Pokémon TCG Live format) ---------- */
const HEADER = /^(pok[eé]mon|trainers?|energy|total cards)\s*[:\-]?\s*\d*\s*$/i;
const FULL = /^(\d+)\s+(.+?)\s+([A-Z][A-Z0-9-]{1,6})\s+([A-Z]{0,3}\d+[a-z]?)$/;
function parseDecklist(text) {
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(/^[*•\-]\s*/, '').trim();
    if (!line || HEADER.test(line)) continue;
    let m = line.match(FULL);
    if (m) { out.push({ count: +m[1], name: m[2], setCode: m[3], number: m[4], raw: line }); continue; }
    m = line.match(/^(\d+)\s+(.+)$/);
    if (m) out.push({ count: +m[1], name: m[2], setCode: '', number: '', raw: line });
  }
  return out;
}
function exportDecklist(entries) {
  const out = [];
  for (const [sec, label] of [['pokemon', 'Pokémon'], ['trainer', 'Trainer'], ['energy', 'Energy']]) {
    const list = sortEntries(entries.filter((e) => sectionOf(e.card) === sec));
    if (!list.length) continue;
    out.push(`${label}: ${list.reduce((n, e) => n + e.count, 0)}`);
    for (const e of list) out.push(`${e.count} ${e.card.name} ${e.card.setCode} ${e.card.number}`);
    out.push('');
  }
  out.push(`Total Cards: ${entries.reduce((n, e) => n + e.count, 0)}`);
  return out.join('\n');
}

For each different card, give:

- setCode: the set code printed near the bottom, like TWM, PAL, SVI or MEG (empty if you can't read it)
- number: the collector number before the slash, like 128 in 128/167 (empty if you can't read it)
- count: how many copies of that exact card are in the photo
Only list real cards you can actually see. If a card is too blurry to name, skip it.`;
const scanModels = {};
function getScanModel(modelName) {
  scanModels[modelName] ||= (async () => {
    const app = await getFirebaseApp();
    const { getAI, getGenerativeModel, GoogleAIBackend, Schema } = await import(FB + 'firebase-ai.js');
    const schema = Schema.object({ properties: { cards: Schema.array({ items: Schema.object({
      properties: { name: Schema.string(), setCode: Schema.string(), number: Schema.string(), count: Schema.integer() },
      optionalProperties: ['setCode', 'number'] }) }) } });
    return getGenerativeModel(getAI(app, { backend: new GoogleAIBackend() }), { model: modelName,
      generationConfig: { responseMimeType: 'application/json', responseSchema: schema, maxOutputTokens: 8192 } });
  })();
  scanModels[modelName].catch(() => { delete scanModels[modelName]; });
  return scanModels[modelName];
}
// Shrink big phone photos before sending (faster, and well within free limits).
function photoToJpeg(file, maxSide = 1600) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(img.src);
      resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => reject(new Error('That file couldn’t be opened as a picture.'));
    img.src = URL.createObjectURL(file);
  });
}
async function scanCardPhoto(file) {
  const data = await photoToJpeg(file);
  const contents = [{ role: 'user', parts: [{ inlineData: { mimeType: 'image/jpeg', data } }, { text: SCAN_PROMPT }] }];
  let result;
  while (true) {
    const name = currentCoachModel();
    try { result = await (await getScanModel(name)).generateContent({ contents }); break; }
    catch (e) {
      if (((isQuotaError(e) && !isPerMinute(e)) || isMissingModel(e)) && modelIndex < COACH_MODELS.length - 1) { modelIndex++; continue; }
      console.error(e); throw new Error(friendlyCoachError(e));
    }
  }
  let found = [];
  try { found = JSON.parse(result.response.text().replace(/^\s*```(?:json)?|```\s*$/g, '')).cards || []; }
  catch { throw new Error('The scan came back unreadable. Try again with a clearer, closer photo.'); }
  return found.filter((c) => c && c.name).map((c) => ({ name: String(c.name).trim(), setCode: String(c.setCode || '').trim().toUpperCase(), number: String(c.number || '').replace(/^0+(?=\d)/, '').trim(), count: Math.max(1, Number(c.count) || 1) }));
}

function friendlyCoachError(e) {
  const m = `${e?.code || ''} ${e?.message || ''}`.toLowerCase();
  if (/quota|resource.?exhausted|429|rate/.test(m)) return isPerMinute(e)
    ? 'The coach is getting questions too fast for the free plan. Wait a minute, then ask again.'
    : 'The coach has used up today’s free requests. They reset overnight (Pacific time). Until then, use Copy for Claude.';
  if (/app.?check|recaptcha|attestation|403|permission/.test(m)) return 'Firebase blocked the coach. Check the App Check and reCAPTCHA steps in SETUP.md, including your site’s address in the reCAPTCHA domains.';
  if (/not.?found|404|model/.test(m)) return `None of the coach models are available right now. Update geminiModel in firebase-config.js to a current Flash-Lite model (see SETUP.md).`;
  if (/api.?not.?enabled|ai logic|firebasevertexai|generativelanguage/.test(m)) return 'AI Logic isn’t turned on for this Firebase project yet. See step 2 in SETUP.md.';
  if (/network|fetch|offline/.test(m)) return 'Couldn’t reach the coach. Check your internet connection and try again.';
  return 'The coach couldn’t answer. Try again, or use Copy for Claude.';
}

// Pull the coach's JSON answer out of the response, even if it has stray text around it.
function parseCoachJson(text) {
  let t = String(text || '').replace(/^\s*```(?:json)?/i, '').replace(/```\s*$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) t = t.slice(a, b + 1);
  const d = JSON.parse(t);
  return { reply: String(d.reply || ''), suggestions: Array.isArray(d.suggestions) ? d.suggestions.filter((x) => x && x.name) : [], remember: String(d.remember || '').trim() };
}
// If the answer was cut off partway, rescue the written reply so it isn't lost.
function salvageReply(text) {
  const m = String(text || '').match(/"reply"\s*:\s*"((?:\\.|[^"\\])*)/);
  if (!m || m[1].length < 20) return null;
  try { return JSON.parse(`"${m[1].replace(/\\$/, '')}"`); } catch { return m[1].replace(/\\n/g, '\n').replace(/\\"/g, '"'); }
}

const isQuotaError = (e) => /quota|resource.?exhausted|429|rate.?limit/i.test(`${e?.code || ''} ${e?.message || ''}`);
const isPerMinute = (e) => /per.?minute|perminute|rpm/i.test(`${e?.message || ''}`);
const isMissingModel = (e) => /not.?found|404|is not supported|unknown model/i.test(`${e?.code || ''} ${e?.message || ''}`);

async function callCoach(contents, web = false) {
  let lastError;
  while (modelIndex < COACH_MODELS.length) {
    const name = currentCoachModel();
    try {
      return { result: await (await getCoachModel(useLightThinking, name, web)).generateContent({ contents }), web };
    } catch (e) {
      lastError = e;
      // Some models don't accept thinking settings; use the plain version and try again.
      if (useLightThinking && /thinking/i.test(`${e?.message || ''}`)) { useLightThinking = false; continue; }
      // If web search isn't available (tool not allowed, its own quota used up), answer without it.
      if (web) { console.warn('Web search unavailable, answering without it', e); web = false; continue; }
      // Out of free daily requests, or the model was retired: move to the next model.
      if ((isQuotaError(e) && !isPerMinute(e)) || isMissingModel(e)) {
        console.warn(`Coach model ${name} unavailable, trying the next one`, e);
        if (modelIndex < COACH_MODELS.length - 1) { modelIndex++; continue; }
      }
      throw e;
    }
  }
  throw lastError;
}

// Google requires showing its search suggestions and the sources whenever an answer used Google Search.
function groundingInfo(result) {
  const g = result?.response?.candidates?.[0]?.groundingMetadata;
  if (!g) return {};
  const sources = [];
  const seen = new Set();
  for (const c of g.groundingChunks || []) {
    const uri = c.web?.uri, title = c.web?.title || c.web?.domain || 'Source';
    if (uri && !seen.has(uri)) { seen.add(uri); sources.push({ title, uri }); }
  }
  return { searchHtml: g.searchEntryPoint?.renderedContent || '', sources: sources.slice(0, 8) };
}

const WEB_HINT = /limitless|tournament|meta|top deck|decklist|best list|website|online|https?:\/\//i;

async function askCoach({ history, message, deck, collection, format, notes, otherDecks, web = false }) {
  const useWeb = web || WEB_HINT.test(message);
  const base = [
    ...history.slice(-12).map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })),
    { role: 'user', parts: [{ text: `${deckContext(deck, collection, format, notes, otherDecks)}\n\n${useWeb ? '(Web search is available for this question.)\n\n' : ''}${message}` }] },
  ];
  let lastText = '';
  for (let attempt = 0; attempt < 2; attempt++) {
    const contents = attempt === 0 ? base : [...base.slice(0, -1), { role: 'user', parts: [{ text: base[base.length - 1].parts[0].text + '\n\n(Please keep this answer short: under 150 words, and at most 6 suggestions. Answer with only the JSON object.)' }] }];
    let res;
    try { res = await callCoach(contents, useWeb); }
    catch (e) { console.error(e); throw new Error(friendlyCoachError(e)); }
    const { result } = res;
    const extra = { ...groundingInfo(result), webNote: useWeb && !res.web ? 'Web search wasn’t available for this answer, so it’s from the coach’s own knowledge.' : '' };
    try { lastText = result.response.text(); } catch (e) { console.error('Coach response had no text', e, result?.response); lastText = ''; }
    try { return { ...parseCoachJson(lastText), ...extra }; }
    catch {
      console.warn('Coach answer could not be read', result?.response?.candidates?.[0]?.finishReason, lastText);
      const rescued = salvageReply(lastText);
      if (rescued) return { reply: rescued.trim() + '\n\n*(This answer got cut off. Ask “keep going” to hear the rest.)*', suggestions: [], ...extra };
      // A plain-text answer (common with web search) is still useful: show it as the reply.
      if (lastText.trim().length > 40 && !/^\s*[{\[]/.test(lastText)) return { reply: lastText.trim(), suggestions: [], ...extra };
    }
  }
  throw new Error('The coach’s answer came back garbled twice. Try a shorter question, or start a New chat (long chats give the coach more to read).');
}

function ownState(count, owned) { return owned >= count ? 'have' : owned > 0 ? 'short' : 'need'; }

function ImportBox({ title, hint, actions, onDone }) {
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  async function run(mode) {
    const lines = parseDecklist(text);
    if (!lines.length) return setMsg({ bad: true, text: 'No card lines found. Each line should look like “4 Dreepy TWM 128”.' });
    setBusy(true); setMsg(null);
    try {
      const results = await resolveLines(lines);
      const ok = results.filter((x) => x.card), failed = results.filter((x) => !x.card).map((x) => x.raw);
      await onDone(ok.map((x) => ({ card: x.card, count: x.count })), mode);
      setMsg({ bad: failed.length > 0, text: failed.length ? `Imported ${ok.length} lines. Couldn’t find: ${failed.join('; ')}` : `Imported ${ok.length} lines.` });
      if (!failed.length) setText('');
    } catch (e) { setMsg({ bad: true, text: e.message || 'Import failed.' }); }
    finally { setBusy(false); }
  }
  return html`<div class="import">
    <h3>${title}</h3>
    <p class="muted small">${hint}</p>
    <textarea rows="7" value=${text} onInput=${(e) => setText(e.target.value)} placeholder=${'Pokémon: 12\n4 Dreepy TWM 128\n...'} aria-label=${title}></textarea>
    <div class="row">${actions.map((a) => html`<button class=${`btn ${a.primary ? '' : 'ghost'}`} disabled=${busy || !text.trim()} onClick=${() => run(a.mode)}>${busy ? 'Looking up cards…' : a.label}</button>`)}</div>
    ${msg && html`<p class=${`small ${msg.bad ? 'warn' : 'muted'}`}>${msg.text}</p>`}
  </div>`;
}

          </div>`;
        })}
  </section>`;
}

/* ---------- Want list ---------- */
// Run async jobs a few at a time (keeps price lookups polite to the free card database).
async function mapLimit(items, limit, fn) {
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => { while (i < items.length) { const j = i++; try { out[j] = await fn(items[j]); } catch { out[j] = null; } } }));
  return out;
}
// Cheapest market price across a card's versions (normal, reverse holo...), falling back to mid.
const marketPrice = (p) => { const vals = (p?.rows || []).map((r) => r.market ?? r.mid).filter((v) => v != null); return vals.length ? Math.min(...vals) : null; };

// Cards the chosen decks need that the Card Library doesn't have, plus cards added by hand.
function buildWantList(decks, selectedIds, mode, collection, wants) {
  const need = {};
  for (const d of decks.filter((x) => selectedIds.includes(x.id))) {
    const perDeck = {};
    for (const e of d.entries) {
      if (isBasicEnergy(e.card)) continue;
      const k = printKey(e.card);
      (perDeck[k] ||= { card: e.card, count: 0 }).count += e.count;
    }
    for (const [k, v] of Object.entries(perDeck)) {
      const row = (need[k] ||= { key: k, card: v.card, needed: 0, decks: [] });
      row.needed = mode === 'all' ? row.needed + v.count : Math.max(row.needed, v.count);
      row.decks.push(`${d.name} (${v.count})`);
    }
  }
  const rows = {};
  for (const r of Object.values(need)) {
    const missing = r.needed - ownedCount(r.card, collection);
    if (missing > 0) rows[r.key] = { ...r, missing, manual: 0 };
  }
  for (const w of Object.values(wants || {})) {
    const k = printKey(w.card);
    if (rows[k]) rows[k].manual += w.count;
    else rows[k] = { key: k, card: w.card, needed: 0, missing: 0, manual: w.count, decks: [] };
  }
  return Object.values(rows).map((r) => ({ ...r, qty: r.missing + r.manual }));
}

    if (!todo.length) return;
    let live = true;
    mapLimit(todo, 4, (r) => fetchPrices(r.card)).then((res) => {
      if (!live) return;
      setPrices((p) => { const n = { ...p }; todo.forEach((r, i) => { n[r.card.id] = marketPrice(res[i]); }); return n; });

      </div>
    </div>

    <div class="want-controls">
      <div><span class="small muted">Count cards needed for:</span>
        <div class="chips">${decks.map((d) => html`<label class=${`chip ${selectedIds.includes(d.id) ? 'on' : ''}`}><input type="checkbox" checked=${selectedIds.includes(d.id)} onChange=${() => toggleDeck(d.id)} />${d.name}</label>`)}</div></div>
      <div class="row">

      : html`<div class="want-list">${sorted.map((r) => html`<div class="want-row" key=${r.key}>

/* ---------- Card versions (other printings of the same card) ---------- */
async function findVersions(query) {
  const q = normName(query || '').trim();
  if (!q) return [];
  await localReady;
  const out = new Map();
  const add = (c) => { if (c && !out.has(c.id)) out.set(c.id, c); };
  // Exact name first, from the saved card data and then TCGdex (which also has older sets).
  (LOCAL?.byName[q.toLowerCase()] || []).forEach(add);
  EXTRA_CARDS.filter((c) => c.name.toLowerCase() === q.toLowerCase()).forEach(add);
  try { (await fetchCards({ name: `eq:${cleanFilter(q)}` }, 250)).map(slimCard).forEach(add); } catch {}
  // Nothing with that exact name? Fall back to names that contain it (helps with misread names).
  if (!out.size) {
    const ql = q.toLowerCase();
    (LOCAL?.cards || []).filter((c) => c.name.toLowerCase().includes(ql)).slice(0, 120).forEach(add);
    EXTRA_CARDS.filter((c) => c.name.toLowerCase().includes(ql)).forEach(add);
    try { (await fetchCards({ name: cleanFilter(q) }, 120)).map(slimCard).forEach(add); } catch {}
  }
  return [...out.values()].sort((a, b) => newestFirst(a, b) || numKey(a.number).localeCompare(numKey(b.number)));
}

function VersionPicker({ name, currentId, onPick, onClose, title = 'Choose the right version' }) {

/* ---------- Deck checkup ---------- */
const textOf = (c) => [...c.attacks.map((a) => a.text), ...c.abilities.map((a) => a.text), ...c.rules].join(' ').toLowerCase();
const ENERGY_NAMES = ['Grass', 'Fire', 'Water', 'Lightning', 'Psychic', 'Fighting', 'Darkness', 'Metal'];
function deckChecks(deck) {
  const E = deck.entries, total = E.reduce((n, e) => n + e.count, 0);
  const sum = (f) => E.filter((e) => f(e.card)).reduce((n, e) => n + e.count, 0);
  const names = new Set(E.map((e) => e.card.name));
  const basics = sum(isBasicMon);
  const energy = sum((c) => sectionOf(c) === 'energy');
  const supporters = sum((c) => c.subtypes.includes('Supporter'));
  const draw = sum((c) => sectionOf(c) !== 'energy' && /\bdraw\b/.test(textOf(c)));
  const search = sum((c) => sectionOf(c) !== 'energy' && /search your deck/.test(textOf(c)));
  const switching = sum((c) => sectionOf(c) === 'trainer' && /switch/.test(textOf(c)));
  const candy = sum((c) => c.name === 'Rare Candy');
  const checks = [];
  const add = (ok, title, detail) => checks.push({ ok, title, detail });
  add(total === 60, `${total} cards`, total === 60 ? 'Exactly 60, ready to play.' : `A deck needs exactly 60 cards (${total < 60 ? `${60 - total} more` : `${total - 60} too many`}).`);
  const noBasic = total >= 7 ? Math.exp(logChoose(total - basics, 7) - logChoose(total, 7)) : 1;
  add(basics >= 8, `${basics} Basic Pokémon`, `About ${pct(noBasic)} of opening hands would be a mulligan (no Basic). ${basics < 8 ? 'Most decks play 8 to 12 so you can start fast.' : 'That’s a healthy number.'}`);
  // Evolution lines
  for (const e of E) {
    const c = e.card;
    if (sectionOf(c) !== 'pokemon' || !c.evolvesFrom || names.has(c.evolvesFrom)) continue;
    const isStage2 = c.subtypes.includes('Stage 2');
    add(false, `${c.name} needs ${c.evolvesFrom}`, isStage2 && candy ? `There’s no ${c.evolvesFrom} in the deck. Rare Candy can skip it, but adding at least one ${c.evolvesFrom} is safer.` : `${c.name} evolves from ${c.evolvesFrom}, which isn’t in the deck, so it can’t be played.`);
  }
  // Energy types needed by attacks
  const needed = new Set();
  E.filter((e) => sectionOf(e.card) === 'pokemon').forEach((e) => e.card.attacks.forEach((a) => (a.cost || []).forEach((t) => ENERGY_NAMES.includes(t) && needed.add(t))));
  const basicTypes = new Set(E.filter((e) => isBasicEnergy(e.card)).map((e) => ENERGY_NAMES.find((t) => e.card.name.includes(t))).filter(Boolean));
  const special = sum((c) => sectionOf(c) === 'energy' && !isBasicEnergy(c));
  const missingTypes = [...needed].filter((t) => !basicTypes.has(t));
  add(!missingTypes.length || special > 0, `${energy} Energy`, missingTypes.length
    ? `Attacks need ${missingTypes.join(' and ')} Energy, but there’s no basic ${missingTypes.join(' or ')} Energy${special ? ' (check that your Special Energy covers it)' : ''}.`
    : energy < 6 ? 'That’s on the low side unless the deck has ways to get Energy back or attacks that don’t need much.' : energy > 16 ? 'That’s a lot. Most decks play about 8 to 14, so some could become draw or search cards.' : 'A sensible amount for most decks.');
  add(supporters >= 8, `${supporters} Supporters`, supporters >= 8 ? 'Good: you’ll usually have a Supporter to play each turn.' : 'Most decks play 8 or more so there’s a Supporter for most turns.');
  add(draw + search >= 10, `${draw} draw and ${search} search cards`, draw + search >= 10 ? 'Plenty of ways to find what you need.' : 'More cards that draw or search your deck (like Arven, Iono, Nest Ball or Ultra Ball) make the deck more consistent.');
  add(switching >= 1, `${switching} switching cards`, switching ? 'You can get a stuck Pokémon out of the Active Spot.' : 'Consider a card like Switch so your Active Pokémon isn’t stuck.');
  return checks;
}
function DeckCheckup({ deck, format, onOpen, onAsk, onClose }) {
  useEscape(onClose);
  const checks = useMemo(() => deckChecks(deck), [deck]);
  const warnings = checks.filter((c) => !c.ok).length;
  const prompt = `Please give "${deck.name}" a full checkup for the ${formatName(format)} format. Look at consistency (Basic Pokémon, draw and search, Supporters), Energy, evolution lines, how the deck wins, and its weak spots. Explain it simply, then suggest specific changes as a mix of cards from our Card Library and cards worth picking up.`;
  return html`<div class="scrim" onClick=${onClose}>
    <div class="modal tester" role="dialog" aria-modal="true" aria-label="Deck checkup" onClick=${(e) => e.stopPropagation()}>
      <div class="tester-head"><h2>Deck checkup</h2><button class="btn ghost small" onClick=${onClose}>Close</button></div>
      <p class="small">${warnings ? `${warnings} thing${warnings === 1 ? '' : 's'} to look at.` : 'Everything here looks good.'} These are quick rule-of-thumb checks; good decks sometimes break them on purpose.</p>
      <ul class="checks">${checks.map((c) => html`<li class=${c.ok ? 'ok' : 'warn'}><span class="check-icon" aria-hidden="true">${c.ok ? '✓' : '!'}</span>
        <div><strong>${c.title}</strong><p class="small">${c.detail}</p></div></li>`)}</ul>
      <div class="row"><button class="btn" onClick=${() => onAsk(prompt)}>Ask the coach for a full checkup</button></div>
    </div>
  </div>`;
}

/* ---------- Deck image and printable list ---------- */
function loadImage(src) {
  return new Promise((resolve) => {
    if (!src) return resolve(null);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
async function drawDeckImage(deck, withPictures = true) {
  const cw = 120, ch = 168, gap = 10, pad = 28, head = 86, foot = 34;
  const groups = [['pokemon', 'Pokémon'], ['trainer', 'Trainers'], ['energy', 'Energy']].map(([k, label]) => ({ label, list: sortEntries(deck.entries.filter((e) => sectionOf(e.card) === k)) })).filter((g) => g.list.length);
  const cols = Math.min(10, Math.max(5, ...groups.map((g) => g.list.length))); // narrower image for small decks
  const rowsFor = (g) => Math.ceil(g.list.length / cols);
  const height = pad + head + groups.reduce((n, g) => n + 30 + rowsFor(g) * (ch + gap), 0) + foot;
  const width = pad * 2 + cols * cw + (cols - 1) * gap;
  const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#1A2340'; ctx.fillRect(0, 0, width, height);
  const total = deck.entries.reduce((n, e) => n + e.count, 0);
  ctx.fillStyle = '#FFFFFF'; ctx.font = '800 38px "Bricolage Grotesque", system-ui, sans-serif'; ctx.fillText(deck.name, pad, pad + 40);
  ctx.fillStyle = '#AEB8D4'; ctx.font = '500 18px Lexend, system-ui, sans-serif';
  ctx.fillText(groups.map((g) => `${g.list.reduce((n, e) => n + e.count, 0)} ${g.label}`).join('  ·  ') + `  ·  ${total} cards`, pad, pad + 70);
  const images = withPictures ? await Promise.all(deck.entries.map((e) => loadImage(e.card.image))) : [];
  const imgFor = (e) => images[deck.entries.indexOf(e)] || null;
  const accent = { 'Pokémon': '#A98BEA', Trainers: '#6EA6F2', Energy: '#E8B33A' };
  let y = pad + head;
  for (const g of groups) {
    ctx.fillStyle = accent[g.label]; ctx.font = '700 20px Lexend, system-ui, sans-serif'; ctx.fillText(`${g.label} (${g.list.reduce((n, e) => n + e.count, 0)})`, pad, y + 20);
    y += 30;
    g.list.forEach((e, i) => {
      const x = pad + (i % cols) * (cw + gap), yy = y + Math.floor(i / cols) * (ch + gap);
      const img = imgFor(e);
      ctx.save(); roundRect(ctx, x, yy, cw, ch, 8); ctx.clip();
      if (img) ctx.drawImage(img, x, yy, cw, ch);
      else { ctx.fillStyle = '#2C3B6B'; ctx.fillRect(x, yy, cw, ch); ctx.fillStyle = '#FFFFFF'; ctx.font = '600 14px Lexend, system-ui, sans-serif';
        const words = e.card.name.split(' '); let line = '', ly = yy + 60;
        for (const w of words) { if (ctx.measureText(line + w).width > cw - 16) { ctx.fillText(line, x + 8, ly); line = ''; ly += 18; } line += w + ' '; }
        ctx.fillText(line, x + 8, ly); ctx.fillStyle = '#AEB8D4'; ctx.font = '12px Lexend, system-ui, sans-serif'; ctx.fillText(`${e.card.setCode} ${e.card.number}`, x + 8, yy + ch - 12); }
      ctx.restore();
      ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(x + cw - 18, yy + ch - 18, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1A2340'; ctx.font = '800 18px "Bricolage Grotesque", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(String(e.count), x + cw - 18, yy + ch - 12); ctx.textAlign = 'left';
    });
    y += rowsFor(g) * (ch + gap);
  }
  ctx.fillStyle = '#7F8AA8'; ctx.font = '14px Lexend, system-ui, sans-serif'; ctx.fillText('Made with Deck Brews', pad, height - 14);
  const missing = withPictures ? deck.entries.filter((e, i) => !images[i]).length : deck.entries.length;
  return new Promise((resolve, reject) => { try { canvas.toBlob((b) => (b ? resolve({ blob: b, missing }) : reject(new Error('no image'))), 'image/png'); } catch (e) { reject(e); } });
}

/* ---------- Compare two decks ---------- */
function DeckCompare({ deck, decks, onOpen, onClose }) {
  useEscape(onClose);
  const others = decks.filter((d) => d.id !== deck.id);
  // Default to the deck with the most cards in common (usually the other version).
  const best = useMemo(() => {
    const keys = new Set(deck.entries.map((e) => printKey(e.card)));
    return [...others].sort((a, b) => b.entries.filter((e) => keys.has(printKey(e.card))).length - a.entries.filter((e) => keys.has(printKey(e.card))).length)[0];
  }, []);
  const [otherId, setOtherId] = useState(best?.id || '');
  const [diffOnly, setDiffOnly] = useState(true);
  const other = others.find((d) => d.id === otherId);
  const rows = useMemo(() => {
    if (!other) return [];
    const map = {};
    const addAll = (d, side) => d.entries.forEach((e) => { const k = printKey(e.card); (map[k] ||= { card: e.card, a: 0, b: 0 })[side] += e.count; });
    addAll(deck, 'a'); addAll(other, 'b');
    const order = { pokemon: 0, trainer: 1, energy: 2 };
    return Object.values(map).sort((x, y) => order[sectionOf(x.card)] - order[sectionOf(y.card)] || x.card.name.localeCompare(y.card.name));
  }, [deck, other]);
  const changed = rows.filter((r) => r.a !== r.b);
  const shown = diffOnly ? changed : rows;
  const moved = changed.reduce((n, r) => n + Math.abs(r.a - r.b), 0);
  return html`<div class="scrim" onClick=${onClose}>
    <div class="modal tester" role="dialog" aria-modal="true" aria-label="Compare decks" onClick=${(e) => e.stopPropagation()}>
      <div class="tester-head"><h2>Compare decks</h2><button class="btn ghost small" onClick=${onClose}>Close</button></div>
      ${!others.length ? html`<p class="empty">You need at least two decks to compare. Use Copy deck to make another version.</p>` : html`
      <div class="searchbar">
        <span class="small"><b>${deck.name}</b> compared with</span>
        <select value=${otherId} onChange=${(e) => setOtherId(e.target.value)} aria-label="Deck to compare with">${others.map((d) => html`<option value=${d.id}>${d.name}</option>`)}</select>
        <label class="check"><input type="checkbox" checked=${diffOnly} onChange=${(e) => setDiffOnly(e.target.checked)} /> Only differences</label>
      </div>
      <p class="small">${changed.length ? html`<b>${changed.length}</b> card${changed.length === 1 ? '' : 's'} differ (${moved} card${moved === 1 ? '' : 's'} swapped in or out).` : 'These two decks are the same.'}</p>
      ${shown.length > 0 && html`<div class="price-table"><table class="compare">
        <thead><tr><th>Card</th><th>${deck.name}</th><th>${other?.name}</th><th>Change</th></tr></thead>
        <tbody>${shown.map((r) => html`<tr class=${r.a > r.b ? 'more' : r.a < r.b ? 'less' : ''}>
          <td><button class="linkbtn" onClick=${() => onOpen(r.card)}>${r.card.name}</button></td><td>${r.a || '–'}</td><td>${r.b || '–'}</td>
          <td>${r.a === r.b ? 'same' : r.b > r.a ? `+${r.b - r.a} in ${other.name}` : `−${r.a - r.b} in ${other.name}`}</td></tr>`)}</tbody>
      </table></div>`}`}
    </div>
  </div>`;
}

/* ---------- Opening-hand tester ---------- */
// Exact odds with the hypergeometric formula: chance of at least one of `k` copies in `n` cards drawn from `N`.
function logChoose(n, r) { if (r < 0 || r > n) return -Infinity; let s = 0; for (let i = 1; i <= r; i++) s += Math.log(n - r + i) - Math.log(i); return s; }
const atLeastOne = (N, k, n) => (k <= 0 ? 0 : 1 - Math.exp(logChoose(N - k, n) - logChoose(N, n)));
const pct = (x) => `${Math.round(x * 100)}%`;
function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const isBasicMon = (c) => sectionOf(c) === 'pokemon' && c.subtypes.includes('Basic');

function DrawTester({ deck, onOpen, onClose }) {
  useEscape(onClose);
  const pile = useMemo(() => deck.entries.flatMap((e) => Array.from({ length: e.count }, (_, i) => ({ ...e.card, _k: `${e.card.id}-${i}` }))), [deck]);
  const N = pile.length;
  const basics = pile.filter(isBasicMon).length;
  const [game, setGame] = useState(null);
  const [showPrizes, setShowPrizes] = useState(false);
  const [pick, setPick] = useState('');
  function newHand() {
    let mulligans = 0, cards;
    if (!basics) { setGame({ error: 'This deck has no Basic Pokémon, so every hand would be a mulligan.' }); return; }
    while (true) { cards = shuffle(pile); if (cards.slice(0, 7).some(isBasicMon)) break; mulligans++; }
    setShowPrizes(false);
    setGame({ hand: cards.slice(0, 7), prizes: cards.slice(7, 13), deck: cards.slice(13), mulligans });
  }
  useEffect(newHand, []);
  const draw = () => setGame((g) => (g?.deck?.length ? { ...g, hand: [...g.hand, g.deck[0]], deck: g.deck.slice(1) } : g));
  const names = [...new Set(deck.entries.map((e) => e.card.name))].sort();
  const copies = pick ? deck.entries.filter((e) => e.card.name === pick).reduce((n, e) => n + e.count, 0) : 0;
  const mini = (c) => html`<button key=${c._k} class="draw-card" onClick=${() => onOpen(c)} title=${c.name}><${CardImage} key=${c._k} card=${c} /></button>`;
  return html`<div class="scrim" onClick=${onClose}>
    <div class="modal tester" role="dialog" aria-modal="true" aria-label="Test draw" onClick=${(e) => e.stopPropagation()}>
      <div class="tester-head"><h2>Test draw</h2><button class="btn ghost small" onClick=${onClose}>Close</button></div>
      ${N !== 60 && html`<p class="small warn">This deck has ${N} cards, so these odds are for ${N}, not 60.</p>`}
      ${game?.error ? html`<p class="warn">${game.error}</p>` : game && html`
        <p class="small">${game.mulligans ? html`<b>${game.mulligans} mulligan${game.mulligans === 1 ? '' : 's'}</b> before a hand with a Basic Pokémon. ` : ''}Opening hand (${game.hand.length} cards), ${game.deck.length} left in the deck.</p>
        <div class="draw-row">${game.hand.map(mini)}</div>
        <div class="row" style="margin:10px 0">
          <button class="btn" onClick=${newHand}>New hand</button>
          <button class="btn ghost" onClick=${draw} disabled=${!game.deck.length}>Draw a card</button>
          <button class="btn ghost" onClick=${() => setShowPrizes(!showPrizes)}>${showPrizes ? 'Hide prizes' : 'Show the 6 prize cards'}</button>
        </div>
        ${showPrizes && html`<div class="draw-row prizes">${game.prizes.map(mini)}</div>`}`}
      <div class="odds">
        <h3>The odds</h3>
        <p class="small">Chance your first 7 cards include a Basic Pokémon: <b>${pct(atLeastOne(N, basics, 7))}</b> (${basics} Basic Pokémon in the deck). The rest of the time you’d mulligan.</p>
        <div class="fld"><label for="oddcard">Chance of drawing a card</label>
          <select id="oddcard" value=${pick} onChange=${(e) => setPick(e.target.value)}><option value="">Pick a card…</option>${names.map((n) => html`<option value=${n}>${n}</option>`)}</select></div>
        ${pick && html`<ul class="small odds-list">
          <li>In your opening hand (7 cards): <b>${pct(atLeastOne(N, copies, 7))}</b></li>
          <li>By your first turn (8 cards): <b>${pct(atLeastOne(N, copies, 8))}</b></li>
          <li>By your second turn (9 cards): <b>${pct(atLeastOne(N, copies, 9))}</b></li>
          <li>At least one copy stuck in your prizes: <b>${pct(atLeastOne(N, copies, 6))}</b></li>
        </ul>
        <p class="small muted">With ${copies} cop${copies === 1 ? 'y' : 'ies'} in ${N} cards. Search cards like Arven or Nest Ball make the real chances better than this.</p>`}
      </div>
    </div>
  </div>`;
}

/* ---------- Scan cards into the Card Library ---------- */
function ScanCards({ collection, onAdd, onOpen }) {
  const fileRef = useRef(null);
  const [picking, setPicking] = useState(null); // index of the row being changed
  const [st, setSt] = useState({ busy: false, error: null, rows: null, msg: '' });
  async function handle(file) {
    if (!file) return;
    setSt({ busy: true, error: null, rows: null, msg: '' });
    try {
      const found = await scanCardPhoto(file);
      if (!found.length) throw new Error('No cards found in that photo. Try a closer shot in good light, with the bottom of each card visible.');
      const resolved = await resolveLines(found.map((c) => ({ ...c, raw: `${c.count} ${c.name} ${c.setCode} ${c.number}`.trim() })));
      setSt({ busy: false, error: null, msg: '', rows: resolved.map((r) => ({ ...r, include: !!r.card })) });
    } catch (e) { setSt({ busy: false, error: e.message, rows: null, msg: '' }); }
  }
  const update = (i, patch) => setSt((s) => ({ ...s, rows: s.rows.map((r, j) => (j === i ? { ...r, ...patch } : r)) }));
  const chosen = (st.rows || []).filter((r) => r.include && r.card && r.count > 0);
  async function addAll() {
    await onAdd(chosen.map((r) => ({ card: r.card, count: r.count })));
    setSt({ busy: false, error: null, rows: null, msg: `Added ${chosen.reduce((n, r) => n + r.count, 0)} cards to your library.` });
  }
  if (!COACH_READY) return null;
  return html`<div class="import scan">
    <h3>Scan cards</h3>
    <p class="muted small">Take a photo of a card or a whole binder page. Make sure the bottom of each card (set code and number) is readable.</p>
    <input ref=${fileRef} type="file" accept="image/*" capture="environment" hidden onChange=${(e) => { handle(e.target.files[0]); e.target.value = ''; }} />
    <div class="row">

      ${st.rows && html`<button class="btn ghost" onClick=${() => setSt({ busy: false, error: null, rows: null, msg: '' })}>Cancel</button>`}
    </div>
    ${st.error && html`<p class="warn small">${st.error}</p>`}
    ${st.msg && html`<p class="small muted">${st.msg}</p>`}
    ${st.rows && html`<div class="scan-results">
      <p class="small">Found ${st.rows.length} different card${st.rows.length === 1 ? '' : 's'}. Check them over, then add them.</p>
      ${st.rows.map((r, i) => html`<div class=${`scan-row ${r.include ? '' : 'off'}`}>
        ${r.card ? html`<${CardTile} card=${r.card} onOpen=${onOpen} />` : html`<div class="ghosted">${r.name}</div>`}
        <div class="scan-body">
          <strong>${r.card ? r.card.name : r.name}</strong>
          <span class="small muted">${r.card ? `${r.card.setCode} ${r.card.number}${r.card.setName ? ` · ${r.card.setName}` : ''}` : `Read as: ${r.raw}`}${r.card ? `, ${ownedCount(r.card, collection)} already in library` : ''}</span>
          <button class="linkbtn small" onClick=${() => setPicking(i)}>${r.card ? 'Wrong version? Pick another' : 'Find this card'}</button>
          ${r.card ? html`<div class="row">
              <${Stepper} label="Copies" value=${r.count} onChange=${(n) => update(i, { count: n })} max=${60} />
              <label class="check small"><input type="checkbox" checked=${r.include} onChange=${(e) => update(i, { include: e.target.checked })} /> Add</label>
            </div>`
            : html`<span class="small warn">Couldn’t match this card automatically.</span>`}
        </div>
      </div>`)}
      <button class="btn" disabled=${!chosen.length} onClick=${addAll}>Add ${chosen.reduce((n, r) => n + r.count, 0)} cards to library</button>
    </div>`}
    ${picking != null && st.rows?.[picking] && html`<${VersionPicker} name=${st.rows[picking].card?.name || st.rows[picking].name} currentId=${st.rows[picking].card?.id}

  </div>`;
}

/* ---------- Deck coach ---------- */
function inline(text) {
  const out = [];
  const re = /\*\*([^*]+)\*\*|\*([^*\s][^*]*)\*/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    out.push(m[1] != null ? html`<strong>${m[1]}</strong>` : html`<em>${m[2]}</em>`);
    last = re.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
function richText(text) {
  const blocks = [];
  let list = null, para = [];
  const flushPara = () => { if (para.length) { blocks.push(html`<p>${inline(para.join('\n'))}</p>`); para = []; } };
  const flushList = () => { if (list) { blocks.push(html`<ul>${list.map((li) => html`<li>${inline(li)}</li>`)}</ul>`); list = null; } };
  for (const raw of String(text || '').split('\n')) {
    const line = raw.trimEnd();
    const bullet = line.match(/^\s*[-*•]\s+(.*)$/);
    if (bullet) { flushPara(); (list ||= []).push(bullet[1]); }
    else if (!line.trim()) { flushPara(); flushList(); }
    else { flushList(); para.push(line); }
  }
  flushPara(); flushList();
  return blocks;
}

const STARTERS = [
  'Which cards in this deck are we missing, and what can we use from our collection instead?',
  'Explain how this deck wins, in a way a kid can follow.',
  'Build a 60-card deck around a Pokémon we own. Ask me which one first.',
];
// Bold phrases in a reply that look like card names and aren't already suggestions.
function mentionedCardNames(reply, suggestions) {
  const have = new Set(suggestions.map((x) => x.name.toLowerCase()));
  const out = [];
  for (const m of String(reply || '').matchAll(/\*\*([^*]{3,40})\*\*/g)) {
    const name = m[1].trim().replace(/[.:!,]+$/, '');
    if (name.split(/\s+/).length > 5 || /^\d/.test(name) || have.has(name.toLowerCase())) continue;
    have.add(name.toLowerCase()); out.push(name);
  }
  return out.slice(0, 6);
}
async function findMentionedCards(names, collection, deck) {
  const known = [...deck.entries.map((e) => e.card), ...Object.values(collection).map((e) => e.card), ...EXTRA_CARDS];
  const results = [];
  for (const name of names) {
    let card = known.find((c) => c.name.toLowerCase() === name.toLowerCase()) || null;
    if (!card) { try { card = await findByName(name); } catch {} }
    if (card) results.push({ action: 'show', name: card.name, count: 1, reason: 'Mentioned above.', card, done: false });
  }
  return results;
}

// Google's search-suggestion chips, kept in a shadow DOM (as Google recommends) so their styles can't affect the page.
function SearchSuggestions({ htmlText }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const root = el.shadowRoot || el.attachShadow({ mode: 'open' });
    root.innerHTML = htmlText;
    root.querySelectorAll('a').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
  }, [htmlText]);
  return html`<div class="search-chips" ref=${ref}></div>`;
}

const CHAT_LIMIT = 40;
const deckCountOf = (deck, card) => deck.entries.filter((e) => e.card.id === card.id || e.card.name === card.name).reduce((n, e) => n + e.count, 0);
// Add a note as a new "- " line, keeping the notes within the length limit.
function addNote(notes, note) {
  const line = `- ${note.replace(/^[-•]\s*/, '').trim()}`;
  return [notes.trim(), line].filter(Boolean).join('\n').slice(-NOTES_LIMIT);
}
function AssistantPanel({ deck, collection, format, store, notes, otherDecks, onAdd, onRemove, onOpen, onOwned, wants = {}, prompt }) {
  const panelRef = useRef(null);
  const [web, setWeb] = usePref('db.webSearch', true);
  const [messages, setMessagesRaw] = useState([]), [input, setInput] = useState(''), [busy, setBusy] = useState(false), [error, setError] = useState(null);

      .catch(() => live && setChatLoaded(true));

  }, [deck.id]);
  // Update the chat and save it (keeps the most recent messages).
  const setMessages = (fn) => setMessagesRaw((prev) => {

    store.saveChat(deck.id, next).catch(() => {});
    return next;
  });

  useEffect(() => { const t = threadRef.current; if (t) t.scrollTop = t.scrollHeight; }, [messages, busy, chatLoaded]);

    if (!confirm('Start a new chat? The saved chat for this deck will be cleared.')) return;

  }

  const lastPrompt = useRef(prompt?.id);
  useEffect(() => {
    if (!prompt || prompt.id === lastPrompt.current) return;
    lastPrompt.current = prompt.id;
    panelRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (COACH_READY && !busy) send(prompt.text, prompt.web); else setInput(prompt.text);
  }, [prompt]);
  async function send(text, webOverride) {
    if (!text.trim() || busy || !COACH_READY) return;

    setMessagesRaw((m) => [...m, { role: 'user', text }]); setInput(''); setBusy(true); setError(null);
    try {
      const d = await askCoach({ history, message: text, deck, collection, format, notes, otherDecks, web: webOverride ?? web });
      let suggestions = d.suggestions;
      if (suggestions.length) {
        let res = [];
        try { res = await resolveLines(suggestions.map((s) => ({ name: s.name, setCode: s.setCode || '', number: s.number || '', count: s.count || 1 }))); } catch {}
        suggestions = suggestions.map((s, i) => ({ ...s, count: s.count || 1, card: res[i]?.card || null, done: false }));
      }
      // Cards the coach mentioned in bold but forgot to list still get pictures.
      try { suggestions = [...suggestions, ...await findMentionedCards(mentionedCardNames(d.reply, suggestions), collection, deck)]; } catch {}
      const remember = d.remember && !notes.toLowerCase().includes(d.remember.toLowerCase()) ? d.remember.slice(0, 200) : '';
      setMessages((m) => [...m, { role: 'assistant', text: d.reply, suggestions, remember, rememberState: remember ? 'ask' : '',
        searchHtml: d.searchHtml || '', sources: d.sources || [], webNote: d.webNote || '' }]);
    } catch (e) { setError(e.message); setMessagesRaw((m) => m.slice(0, -1)); setInput(text); }
    finally { setBusy(false); }
  }
  const updateSugg = (mi, si, patch) =>

  async function copyForClaude() {

  return html`<aside class="assistant" ref=${panelRef}>

      ${COACH_READY && chatLoaded && messages.length === 0 && html`<div class="starters">
